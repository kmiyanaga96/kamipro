<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神姫 光バーストトラッカー</title>
<style>
:root{--bg:#f5f6f8;--card:#ffffff;--card2:#f0f2f5;--border:#e2e5ea;
  --accent:#5b6ef5;--accent2:#3d4fd6;--green:#1aa179;--orange:#e08a00;
  --red:#e0392b;--text:#1f2430;--muted:#6b7280;--yellow:#b7791f;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 2px 6px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,'Hiragino Kaku Gothic ProN',Meiryo,'Roboto',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;line-height:1.5;}
.header{background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow);
  padding:14px 24px;display:flex;align-items:center;gap:12px;}
.header h1{font-size:16px;color:var(--text);font-weight:700;}
.header .sub{font-size:11px;color:var(--muted);}
.layout{display:flex;height:calc(100vh - 52px);}
.sidebar{width:240px;min-width:240px;background:var(--card);border-right:1px solid var(--border);
  overflow-y:auto;padding:16px;}
.main{flex:1;overflow-y:auto;padding:18px;}
.cfg-title{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border:none;
  border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow);}
.btn-primary:hover{background:var(--accent2);box-shadow:var(--shadow-md);}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);background:var(--card2);}
.btn-sm{padding:4px 10px;font-size:11px;}
.party-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;
  padding:10px 14px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);}
.party-bar .pb-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.party-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:14px;
  font-size:12px;font-weight:600;background:var(--card2);color:var(--text);border:1px solid var(--border);}
.party-chip .pc-role{font-size:9px;color:var(--accent2);font-weight:700;}
.controls{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.controls label{font-size:12px;color:var(--muted);}
.controls input[type=number]{width:58px;background:var(--card);border:1px solid var(--border);
  color:var(--text);padding:6px 8px;border-radius:8px;font-size:14px;text-align:center;}
.summary-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;padding:14px 16px;
  background:var(--card);border-radius:12px;box-shadow:var(--shadow);}
.summary-stat{display:flex;flex-direction:column;align-items:center;flex:1;min-width:80px;}
.summary-stat .val{font-size:20px;font-weight:700;color:var(--accent2);}
.summary-stat .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
/* 火力指数ブロック */
.fi-block{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;min-width:180px;
  padding:10px 18px;border-radius:10px;background:var(--card2);border:1px solid var(--border);}
.fi-top{display:flex;align-items:baseline;gap:8px;}
.fi-val{font-size:32px;font-weight:800;letter-spacing:-1px;}
.fi-grade{font-size:15px;font-weight:800;padding:2px 10px;border-radius:6px;color:#fff;}
.fi-grade.gs{background:#d97706;}
.fi-grade.ga{background:var(--accent2);}
.fi-grade.gb{background:var(--green);}
.fi-grade.gc{background:var(--muted);}
.fi-bar-wrap{width:100%;height:7px;background:var(--border);border-radius:4px;margin-top:7px;overflow:hidden;}
.fi-bar-fill{height:100%;border-radius:4px;transition:width .4s;}
.fi-sub{font-size:9px;color:var(--muted);margin-top:4px;letter-spacing:.4px;}
/* 編成保存スロット */
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px;}
.slot-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
.slot-card .slot-name{font-size:13px;font-weight:700;margin-bottom:4px;}
.slot-card .slot-members{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:8px;}
.slot-card .slot-btns{display:flex;gap:6px;flex-wrap:wrap;}
.slot-empty{font-size:11px;color:var(--muted);padding:6px 0;}
.slot-status{font-size:10px;color:var(--muted);margin-top:6px;}
.turn-card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);}
.turn-card.full-burst{border-left:4px solid var(--green);}
.turn-card.partial{border-left:4px solid var(--orange);}
.turn-card.helix-turn{border-left:4px solid var(--red);}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  background:var(--card);cursor:pointer;user-select:none;}
.card-header:hover{background:var(--card2);}
.turn-label{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.turn-num{font-size:16px;font-weight:700;color:var(--accent2);min-width:30px;}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:12px;
  font-size:10px;font-weight:700;}
.bg{background:rgba(26,161,121,.12);color:var(--green);}
.bo{background:rgba(224,138,0,.12);color:var(--orange);}
.br{background:rgba(224,57,43,.12);color:var(--red);}
.bp{background:rgba(91,110,245,.12);color:var(--accent2);}
.bm{background:var(--card2);color:var(--muted);}
.card-body{padding:14px 16px;}
.card-body.collapsed{display:none;}
.action-order{background:var(--card2);border-radius:10px;padding:11px 13px;margin-bottom:11px;
  font-size:12px;line-height:2.4;}
/* アビリティ色チップ（黄/赤/青/緑＝アビ色と一致） */
.abi-chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:14px;
  border:1px solid;font-size:11px;font-weight:600;white-space:nowrap;}
.ord-arrow{color:var(--muted);margin:0 5px;font-size:11px;}
.gauges{display:flex;flex-direction:column;gap:5px;}
.gauge-row{display:flex;align-items:center;gap:8px;}
.gauge-name{width:54px;font-size:11px;color:var(--muted);text-align:right;flex-shrink:0;}
.gauge-wrap{flex:1;height:8px;background:var(--card2);border-radius:5px;overflow:hidden;}
.gauge-fill{height:100%;border-radius:5px;}
.gauge-val{width:32px;font-size:11px;color:var(--text);text-align:right;flex-shrink:0;font-weight:600;}
.ge{background:#5b6ef5;}
.gy{background:#e84393;}
.gh{background:#1aa179;}
.gt{background:#e08a00;}
.gl{background:#42a5f5;}
.renri-wrap{position:relative;height:12px;background:var(--card2);border-radius:6px;overflow:hidden;margin-bottom:4px;}
.renri-fill{height:100%;background:linear-gradient(90deg,#5b6ef5,#8b5cf6);border-radius:6px;}
.renri-mark{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.12);}
.loops{display:flex;gap:8px;margin-bottom:11px;flex-wrap:wrap;}
.loop-badge{display:flex;flex-direction:column;align-items:center;padding:5px 11px;border-radius:8px;font-size:10px;gap:2px;border:1px solid var(--border);}
.loop-badge .ln{color:var(--muted);}
.loop-badge .lv{font-weight:700;font-size:12px;}
.la{background:rgba(26,161,121,.1);}.la .lv{color:var(--green);}
.li{background:rgba(224,57,43,.08);}.li .lv{color:var(--red);}
.lw{background:rgba(224,138,0,.1);}.lw .lv{color:var(--orange);}
.lp{background:rgba(91,110,245,.1);}.lp .lv{color:var(--accent2);}
.summary-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:18px;
  background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
.summary-table th,.summary-table td{border-bottom:1px solid var(--border);padding:7px 8px;text-align:center;}
.summary-table th{background:var(--card2);color:var(--accent2);font-size:10px;font-weight:700;}
.summary-table tr:last-child td{border-bottom:none;}
.summary-table tr:hover td{background:var(--card2);}
.tg{color:var(--green);font-weight:700;}.to{color:var(--orange);font-weight:600;}
/* 編成選択パネル */
.formation-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow);}
.formation-panel .fp-row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-top:10px;}
.formation-panel .fp-section{display:flex;flex-direction:column;gap:6px;}
.formation-panel .fp-label{font-size:10px;color:var(--muted);font-weight:600;}
.hero-cards{display:flex;gap:6px;flex-wrap:wrap;}
.hero-card{display:none;}
.hero-card+label{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;
  border:2px solid var(--border);background:var(--card2);cursor:pointer;transition:all .15s;}
.hero-card:checked+label{border-color:var(--accent);background:rgba(91,110,245,.1);color:var(--accent2);}
.kslots{display:flex;gap:6px;flex-wrap:wrap;}
.kslot-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;}
.kslot-wrap .slot-num{font-size:9px;color:var(--muted);}
.kslot-wrap select{padding:5px 8px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);font-size:12px;color:var(--text);min-width:90px;cursor:pointer;}
.kslot-wrap select:focus{outline:none;border-color:var(--accent);}

/* ===== レスポンシブ（タブレット〜スマホ） ===== */
@media (max-width:768px){
  body{font-size:13px;}
  .header{padding:11px 14px;gap:8px;}
  .header h1{font-size:14px;}
  .header .sub{font-size:10px;}
  /* 横並びレイアウト→縦積み。100vh固定を解除しページ全体でスクロール */
  .layout{flex-direction:column;height:auto;}
  .main{order:1;padding:12px;overflow:visible;}
  /* サイドバー(凡例/固定仕様)はメインの下へ。全幅・高さ自動 */
  .sidebar{order:2;width:100%;min-width:0;border-right:none;border-top:1px solid var(--border);
    padding:14px;overflow:visible;}
  .formation-panel{padding:12px;margin-bottom:12px;}
  .formation-panel .fp-row{gap:12px;}
  .kslot-wrap select{min-width:0;width:100%;}
  .kslots{gap:8px;}
  /* 神姫スロットを2列グリッドで指がタップしやすく */
  .kslot-wrap{flex:1 1 calc(50% - 4px);min-width:120px;}
  .controls input[type=number]{font-size:16px;}/* iOSズーム防止に16px */
  .btn{padding:10px 16px;}/* タップ領域確保 */
  /* サマリは2列に折返し */
  .fi-block{min-width:150px;padding:8px 12px;}
  .fi-val{font-size:26px;}
  .summary-stat{min-width:64px;flex:1 1 28%;}
  .summary-stat .val{font-size:17px;}
  .card-header{padding:11px 13px;}
  .card-body{padding:12px 13px;}
  .action-order{line-height:2.2;padding:10px 11px;}
  .gauge-name{width:46px;}
  .summary-table{font-size:10px;display:block;overflow-x:auto;white-space:nowrap;}
}
@media (max-width:430px){
  .header h1{font-size:13px;}
  .main{padding:10px;}
  .sidebar{padding:12px;}
  .turn-num{font-size:15px;min-width:26px;}
  .abi-chip{font-size:10px;padding:3px 8px;}
  .ord-arrow{margin:0 3px;}
  .summary-stat{flex:1 1 44%;}
  /* 神姫スロットは1列(狭幅で潰れ防止) */
  .kslot-wrap{flex:1 1 100%;}
  .gear-grid{grid-template-columns:1fr!important;}
}
/* ===== ランディング・ローディング ===== */
.sim-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 20px;color:var(--muted);gap:12px;text-align:center;}
.sim-placeholder .ph-icon{font-size:40px;opacity:0.35;}
.sim-placeholder .ph-msg{font-size:13px;}
.sim-loading{display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 20px;gap:16px;}
.sim-loading.active{display:flex;}
.spin{width:40px;height:40px;border:4px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.pc-atk{font-size:10px;color:var(--muted);margin-left:4px;}
.pc-hp{font-size:10px;color:var(--accent2);margin-left:3px;}
.spin-msg{font-size:13px;color:var(--muted);}
.spin-sub{font-size:11px;color:var(--muted);opacity:0.7;}

.gear-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px;}
.gear-sub{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;}
.gear-row{display:flex;align-items:center;gap:8px;font-size:11px;margin-bottom:5px;}
.gear-row .slot-num,.gear-row .wpn-lbl{min-width:88px;color:var(--muted);}
.gear-row select{flex:1;background:var(--bg);border:1px solid var(--border);
  border-radius:6px;padding:3px 6px;font-size:11px;}
.gear-row input[type=number]{background:var(--bg);border:1px solid var(--border);
  border-radius:6px;padding:3px 6px;font-size:11px;}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>⚡ 神姫PROJECT R — バーストトラッカー</h1>
    <div class="sub">バースト編成シミュレーター &amp; 最適押し順トラッカー</div>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="cfg-title">📖 凡例</div>
    <div style="font-size:10px;color:var(--muted);line-height:2.1;">
      <div><span style="color:var(--green)">●</span> 5人フルバースト</div>
      <div><span style="color:var(--orange)">●</span> 部分バースト</div>
      <span id="legend-dyn"></span>
      <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;">
        <span class="abi-chip" style="background:#fff8e1;color:#b7791f;border-color:#f6c344;">黄</span>
        <span class="abi-chip" style="background:#ffebee;color:#c62828;border-color:#ef5350;">赤</span>
        <span class="abi-chip" style="background:#e3f2fd;color:#1565c0;border-color:#42a5f5;">青</span>
        <span class="abi-chip" style="background:#fafafa;color:#616161;border-color:#bdbdbd;">白</span>
        <span class="abi-chip" style="background:#e8f5e9;color:#2e7d32;border-color:#66bb6a;">緑</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div id="formation-panel"></div>
    <div id="gear-panel"></div>
    <div id="slots-panel"></div>
    <!-- シミュレーション対象パーティ（動的描画） -->
    <div id="party-bar" class="party-bar"></div>
    <div class="controls">
      <label>ターン数:</label>
      <input type="number" id="turns-n" value="10" min="1" max="30">
      <button class="btn btn-primary" onclick="runSim()">▶ シミュレーション実行</button>
      <button class="btn btn-secondary" onclick="clearSim()">✕ クリア</button>
    </div>
    <div id="summary-bar" style="display:none;"></div>
    <div id="sim-loading" class="sim-loading">
      <div class="spin"></div>
      <div class="spin-msg">最適押し順を計算中…</div>
      <div id="spin-progress" class="spin-sub">準備中</div>
    </div>
    <div id="sim-results"></div>
  </div>
</div>

<script src="data/weapons.js"></script>
<script>
// ===== ゲーム定数（確定仕様） =====
const RENRI_CAP = 5;   // コヴァレント: procの同ターン発動上限(連理魔力+1＆ジャッジ再発動を同時付与)
const RENRI_MAX = 30;  // 連理魔力の総上限(実機検証: 30で頭打ち・以降加算なし。JDリキャストは継続処理)
const JUDG_REACT= RENRI_CAP; // ジャッジ再発動はprocと同一カウンタ。実発動上限=再発動5回+初回自然分1回=最大6回
const TENYA_FROM= 2;   // 天矢乱舞: 使用可能開始ターン
const FB_THR    = 100; // フルバースト閾値（カスケードあり）
const MACH_BG   = 5;   // マシーンタクトゥ: ロボ作動1回あたりBG増加
const KEIGYO_MAX= 15;  // 契晶最大値
const BEAM_W      = 32;  // ビームサーチ幅（本ターン）: 各ステップで保持する候補数
const BEAM_W_INNER= 4;   // ビームサーチ幅（ロールアウト内）: 深度1クローンで使用
const IFISHANT_MIN_CD = 3; // イフィシャント使用可の最小CD中アビ数（早撃ち=機会損失の抑止下限）
const BG = {inori:100,funki:10,absolute:20,sleur:15,legend:10,
            pactcore:100,cascade:10,yamato_max:200,other_max:100};

// ===== 概算火力モデル定数 =====
// damageCalculator.txt の乗算ボックスのうち、押し順で動く加算枠(アサルト/属性値/バーストダメUP/急所)
// を追跡し、押し順非依存の枠(特殊攻撃/上限等)は misc に一括概算する。反逆は無視。
// 旺盛/会心はアブソ有効時のみの条件付き枠。急所は puvoir/absolute/legend の各スタックから期待値計算。
// バフは上限なしで独立累積し、それぞれが持続ターンを持つ(buf辞書で管理・tickで失効)。
// 急所は有利属性のみ発動だが、ランキング用途のため期待値(発動率×(倍率-1))で一律加算する。
// 属性相性はUIで有利(×1.5)/中立(×1.0)を選択しGEAR_Kに畳み込む。
// 値は実測ベース。火力は「プランのランキング(相対比較)」に用いるため絶対値の厳密性は問わない。
const DMG = {
  base_atk: 1500,            // 表示攻撃力（UIから上書き可）
  enemy_def: 10,             // 敵防御（固定値・押し順非依存のため一定）
  affinity: 1.0,             // 属性相性: 有利=1.5 / 中立=1.0（UIから上書き可）
  misc: 1.0,                 // 特殊攻撃/各種ダメージ上限等の押し順非依存枠の一括概算
  // ─── アサルト枠(1スタックあたり) ────────────────────────────────────
  assault_banoshik: 0.10,    // バノーシク: 補助ロボ作動中の黄アビ毎にアサルト+10%
  assault_absolute: 0.30,    // アブソ: アサルト+30%
  // ─── 攻撃ロボ(ドロイドアナバシス・赤アビ反応)枠 ──────────────────────
  droid_react_mult: 3.0,     // 攻撃ロボ反応ダメージ: 通常攻撃比3倍(ランチャータンク装備時3.5倍は未配線)
  droid_react_cap:  500000,  // 反応ダメージ減衰上限(50万・ランチャータンク装備時65万は未配線)
  abi_dmg_droid:    0.03,    // 攻撃ロボ反応毎: 味方全体アビダメ+3%(累積可)
  abi_cap_droid:    0.02,    // 攻撃ロボ反応毎: 味方全体アビダメ上限+2%(累積可)
  // ─── 属性値枠(1スタックあたり) ──────────────────────────────────────
  elem_puvoir:      0.15,    // プヴワール: 光属性攻撃+15%
  // ─── バーストダメージUP枠(1スタックあたり) ──────────────────────────
  burst_dmg_absolute: 0.30,  // アブソ: バーストダメージ+30%
  // ─── 旺盛(フルHP前提で最大・複数ソース加算し+100%で頭打ち) ──────────
  vigor_absolute: 0.30,      // アブソ: 旺盛 基礎値36 → ×1.3
  vigor_legend:   0.3552,    // レジェンド(契晶70+): 旺盛 基礎値42 → ×1.3552
  // ─── 会心(倍率固定1.5倍=+0.5、発動率のみ加算しmin1.0) ────────────────
  crit_mult:          0.5,   // 会心倍率1.5倍 → +0.5
  crit_rate_arrive:   0.20,  // ARRIVE(エレイン3アシ): 会心発動率+20%(永続)

// ===== 装備設定(幻獣・ウェポン) =====

// 各ボックスへの加算値(fraction)として _na() が参照する。シミュ開始時にUIから applyGear() で設定。
// 全0なら倍率1.0でベースライン不変。ウェポンは % 入力 → ×(1+Σweapon_amp) → fraction で格納。
const GEAR_BOXES = [
  ['assault',  'アサルト'],      // (1+アサルト...) 枠: キャラUP幻獣・アサルトスキル
  ['elem',     '属性値'],        // 属性値枠: 属性値UP幻獣・属性スキル
  ['vigor',    '旺盛'],          // 旺盛枠(+100%上限はpush分と合算): 旺盛UP幻獣・ヴィゴラス
  ['spec',     '特殊攻撃'],      // 特殊攻撃枠: 特殊攻撃UP幻獣・特殊スキル
  ['dmgup',    '与ダメージ'],    // 与ダメージUP枠(白虎等)
  ['acute',    '急所'],          // 急所枠: 急所スキル(期待寄与を直接入力)
  ['crit_rate','会心発動率'],    // 会心発動率枠(min1.0でクランプ)
  ['other',    'その他バフ補正'],// その他バフ補正枠(テクニカは別枠technicaへ分離)
  // テクニカ枠: 実機式では other と同枠(通常攻撃に乗る)だが、バーストは「通常攻撃ダメ(テクニカ除く)」
  // を基準にするため burst() で割り戻せるよう分離管理する。通常攻撃/アビには other と同様に乗る。
  ['technica', 'テクニカ'],
  // ─── フレーム別ダメージUP枠(該当フレームのみ加算・_na()のbaseには含めない) ───
  ['na_dmg',   '通常攻撃ダメUP'], // 通常攻撃のみ: judge ph2(通常)に ×(1+na_dmg)
  ['abi_dmg',  'アビダメUP'],     // アビダメのみ: judge ph0/コンソートに ×(1+abi_dmg)
  ['burst_dmg','バーストダメUP'], // バーストのみ: burst()係数に加算(a+...+burst_dmg)
  // ─── 上限UP枠(基盤のみ・基準上限×(1+上限UP)。通常/バーストの基準上限はInfinity=休眠) ───
  ['na_cap',   '通常ダメ上限UP'], // 基準上限 DMG.cap_na(=∞・休眠)
  ['abi_cap',  'アビダメ上限UP'], // 基準上限 judg_cap/consort_cap を ×(1+abi_cap)
  ['burst_cap','バーストダメ上限UP'], // 基準上限 DMG.cap_burst(=∞・休眠)
];
const GEAR = Object.fromEntries(GEAR_BOXES.map(([k])=>[k,0]));

// 幻獣プリセット(3種)。シミュ時に重複を許して SUMMON_SLOTS 枠採用する。
// weapon_amp: ウェポンスキル効果量UP(採用枠分を加算) / box: {ボックスキー: 直接加算fraction}。

  catas: { jp:'カタス',       weapon_amp:0.50, atk:0,    hp:0, elem:'light', box:{assault:1.0} },
  oni:   { jp:'鬼',           weapon_amp:0.50, atk:0,    hp:0, elem:'dark',  box:{assault:1.0, spec:0.10} },
};
const SUMMON_SLOTS = 2; // シミュ時に採用する幻獣枠数(重複可)

// _na() ホットパス用: 押し順非依存の固定係数を事前畳み込み(GEAR変更時に再計算)
let GEAR_K = 0;
let GEAR_K_C = {};      // per-character GEAR_K: {charKey: 表示攻撃力ベースのスケール係数}
let DISPLAY_ATK_C = {}; // per-character 表示攻撃力(UI表示用)
let DISPLAY_HP_C = {};  // per-character 表示HP(UI表示用)

// SSRレベル上限解放の累積ステータス増加量(攻撃力増加列・型非依存／公式有志検証データ)。
// 解放前(Lv80)=増分なし。神姫のbaseAtk/baseHpはLv80基準値とし、解放分をここで上乗せする。
const SSR_LV_RELEASE = {
  80: { atk: 0,    hp: 0   },
  85: { atk: 1950, hp: 375 },
  90: { atk: 3900, hp: 750 },
};

// 実機表示ATKの直接指定(0-fudge較正)。Lv上限解放/+99/育成途中/placeholderを全て内包した
// ゲーム画面の確定表示値をキャラ毎に上書きする。指定があれば calcDisplayAtk(満凸推定) より優先する。
// decompose(満凸WEAPON_MASTER + 得意補正 + SSR_LV_RELEASE)は target build 用途として温存し、
// ここは現状の実機合わせ。{} なら従来どおり全キャラ calcDisplayAtk へフォールバック(現状維持)。
const DISPLAY_ATK_OVERRIDE = {
  // 検証編成・育成途中スクショ実測(エジソン + 光4・テトラのみLv90解放)。
  // 別編成に差し替える際はその編成の実機表示ATKに更新するか、行を消せば満凸推定へ戻る。

};

// ゲーム画面の確定表示HPをキャラ毎に上書きする(ATK overrideと完全対称・0-fudge)。
// 将来「旺壮」(最大HPを参照して特殊攻撃力UPを付与する仕様)を実装する際、その最大HP基準値となる土台。
// (※「旺盛/ヴィゴラス」は現在HP参照の別スキルで、シムは最大HP前提に簡略化し vigor 枠で実装済み)
// +99/育成途中/placeholder武器/Lv上限解放を全て内包した実測値で calcDisplayHp(満凸推定) を上書きする。
// 空 {} なら従来どおり全キャラ calcDisplayHp へフォールバック(現状維持・挙動不変)。
const DISPLAY_HP_OVERRIDE = {
  // 検証編成・育成途中スクショ実測(DISPLAY_ATK_OVERRIDEと同一編成・同一出典)。
  edison: 9689, yamato: 7628, hecate: 8332, tetra: 8332, elaine: 8345,

// 表示攻撃力算出: 武器ATK×得意補正 + 幻獣ATK合計 + キャラ基本ATK(神姫) or 英霊基本値
// slots: 長さ10の武器キー配列(slot0=メイン, 1-9=サブ。空文字=未装備)
// summonAtkTotal: 編成画面のメイン+サブ幻獣ATK合計(表示寄与分・手動入力)
// heroRank: ランク値（マスターボーナスは対象英霊をシミュ対象外としたため非適用）
// 神姫/英霊で武器・幻獣は共通だが、得意補正は各キャラのfavWeaponで個別に効く。
function calcDisplayAtk(charKey, slots, summonAtkTotal, heroRank){
  const def = CHAR_REGISTRY[charKey];
  if(!def || typeof WEAPON_MASTER==='undefined') return 0;
  const fav = def.favWeapon||[];
  let weaponAtk=0;
  for(let i=0;i<slots.length;i++){
    const w=WEAPON_MASTER[slots[i]]; if(!w) continue;
    weaponAtk += Math.floor(w.atk*(fav.includes(w.type)?1.2:1.0));
  }
  if(def.type==='hero'){
    const r=heroRank, lvUp=def.lvUpAtk||0;
    const rankBonus=Math.min(r,100)*40+Math.max(0,Math.min(r,200)-100)*20+Math.max(0,r-200)*10;
    return Math.round(1000+lvUp+rankBonus+weaponAtk+summonAtkTotal);
  }
  // 神姫はマスターボーナス非適用。baseAtk(Lv80基準)にレベル上限解放の累積増分を上乗せ。
  return (def.baseAtk||0)+(SSR_LV_RELEASE[def.lvCap||80]?.atk||0)+weaponAtk+summonAtkTotal;
}
// 表示HP算出: 武器HP×得意補正 + 幻獣HP合計 + キャラ基本HP(神姫) or 英霊基本値
// summonHpTotal: 幻獣HP合計(表示寄与分・手動入力)（マスターボーナスHPは非適用）
function calcDisplayHp(charKey, slots, summonHpTotal, heroRank){
  const def = CHAR_REGISTRY[charKey];
  if(!def || typeof WEAPON_MASTER==='undefined') return 0;
  const fav = def.favWeapon||[];
  let weaponHp=0;
  for(let i=0;i<slots.length;i++){
    const w=WEAPON_MASTER[slots[i]]; if(!w) continue;
    weaponHp += Math.floor((w.hp||0)*(fav.includes(w.type)?1.2:1.0));
  }
  if(def.type==='hero'){
    const r=heroRank, lvUpHp=def.lvUpHp||0;
    const rankBonus=Math.min(r,100)*8+Math.max(0,Math.min(r,200)-100)*2+Math.max(0,r-200)*1;
    return Math.round(600+lvUpHp+rankBonus+weaponHp+summonHpTotal);
  }
  return (def.baseHp||0)+(SSR_LV_RELEASE[def.lvCap||80]?.hp||0)+weaponHp+summonHpTotal;
}

// 属性相性(affinity)は属性枠の中に加算で入る(実機式: 属性枠=属性相性+属性値…)ため、
// GEAR_Kには畳み込まず _na() の属性枠で (affinity + elem) として加算する。
function recalcGearK(){ GEAR_K = DMG.base_atk*(1+GEAR.dmgup)*(1+GEAR.other)*(1+GEAR.technica)*DMG.misc/DMG.enemy_def; }
recalcGearK();

  edison: {
    type: 'hero',
    jp: 'エジソン', gcls: 'ge', elem: null,
    favWeapon: ['銃','魔導具'], lvUpAtk: 400,
    state: { droid: 0, banoshik_robot: 0, ycount: 0 },  // droid: 攻撃ロボ残T / banoshik_robot: 補助ロボ残T / ycount: 黄アビ累計
    abilities: {
      droid:    ['y', 8, 0],
      banoshik: ['y', 8, 0],
      ifishant: ['y', 5, 0],
      amplifa:  ['y', 7, 0],
    },
    labelSuffix: {},
    cdShow: { banoshik:"バノーシク", droid:"ドロイド", ifishant:"イフィシャント", amplifa:"アンプリファ" },
    // cands: 各アビリティの候補登録。{s:優先スコア(数値or関数), guard?:(sim,T,t)=>bool, exec?:(sim,T,ord,bset,t)=>void}
    // exec省略時はデフォルト: sim.use(key,T,ord)
    cands: {
      droid:    { s:201, atkBuf:true, deploysRobot:true, exec:(sim,T,ord)=>{ sim.droid=3; sim.use('droid',T,ord); }},
      banoshik: { s:200, atkBuf:true, deploysRobot:true, exec:(sim,T,ord)=>{ sim.banoshik_robot=3; sim.use('banoshik',T,ord); }},
      // アンプリファ: 効果3T・エジソンの攻撃ロボ反応ダメージに固定+10万(use()のロボ反応点で加算)。
      // prelude:true = ロボ起動後に打つと攻撃ロボ反応の全ヒットを底上げするためルート列挙対象。
      amplifa:  { s:180, atkBuf:true, prelude:true, exec:(sim,T,ord)=>{ (sim.buf.amplifa_buf??=[]).push(DMG.dur_amplifa); sim.use('amplifa',T,ord); }},
      // スコアは(CD中アビ数)²: count=4→16(低),count=8→64(effond直前),count=10→100(高)
      // 多くのアビがCD中のターンで自然に高優先度になり、T1序盤の空打ちを回避する。
      // guard: CD中アビが IFISHANT_MIN_CD 個未満の間は使用不可(空打ち=機会損失を防ぐハード下限)。
      // ビーム目的関数は総ダメージ駆動でスコアより優先するため、早撃ち抑止にはガードが必須。
      // 検証(edison+光4): 下限1→総8.77M / 下限2〜4→総9.52M(最適plateau)。中央値3を採用。
      ifishant: { s:(sim)=>{ const ct=Object.keys(sim.cd).filter(k=>k!=='ifishant'&&sim.cd[k]>0).length; return ct*ct; },
                  guard:(sim)=>Object.keys(sim.cd).filter(k=>k!=='ifishant'&&sim.cd[k]>0).length>=IFISHANT_MIN_CD,
                  exec:(sim,T,ord)=>{ for(const k of Object.keys(sim.cd)) if(k!=='ifishant'&&sim.cd[k]>0) sim.cd[k]--; sim.use('ifishant',T,ord); }},
    },
    def: {
      gmax: BG.other_max,
      keigyoGain: 3,
      onBurst: (sim, atk) => {
        if(atk){ sim.cd.droid=Math.max(0,sim.cd.droid-1); sim.cd.banoshik=Math.max(0,sim.cd.banoshik-1); }
      },
      turnEnd: (sim) => { if(sim.cum>=80) sim.addG([LEADER],20); },
    },
  },

  yamato: {
    type: 'kamihime',
    jp: '[光醒の現神]ヤマトタケル', shortJp: 'ヤマト', gcls: 'gy', elem: 'light',
    favWeapon: ['剣','槍'], baseAtk: 10000, baseHp: 1100,
    // inori_p=現神の祈りの天矢乱舞解禁タイマー / yellow_acc=黄アビ累計(ターン跨ぎ・永続) / funki_cycle=大和の奮起の使用可能化カウント(0〜3) / funki_recharge=ターン終了時の再発動予約
    state: { inori_p: null, yellow_acc: 0, funki_cycle: 0, funki_recharge: false },
    abilities: {
      inori: ['y', 14, 0],
      tenya: ['r', 12, 0],
      funki: ['y', 5, 0],
    },
    labelSuffix: { inori:'(ヤ+100)', funki:'(+10)' },
    cdShow: { inori:"現神の祈り", tenya:"天矢乱舞", funki:"大和の奮起" },
    cands: {
      funki: { s:150, atkBuf:true, partyBG:true, exec:(sim,T,ord)=>{ sim.ycount++; sim.addG(CHARS,BG.funki);
        // 大和の奮起: ヤマト自身のバースト性能UP(+15%/上限+10%・3T累積可) → burstBonusで参照
        (sim.buf.funki_burst??=[]).push(DMG.dur_funki_burst);
        if(sim.ycount%3===0) sim.cd.inori=Math.max(0,sim.cd.inori-1); sim.use('funki',T,ord); }},
      // 現神の祈り: 自分ゲージ+100 ＋ バースト性能大幅UP(倍率5→10・3T・burstBonusで参照) ＋ 2T後に天矢乱舞解禁。
      // 旧版はFB可否のlookaheadガードで実質発火しなかったが、本体は純火力(バースト倍率2倍)のためガード撤廃。
      // CD14で実質1回・最適化器(ビーム/ルート分散)に開幕タイミングを委ねる。
      inori: { s:160, atkBuf:true,
        exec:(sim,T,ord)=>{ sim.addG([ownerOf('inori')],BG.inori); sim.inori_p=0;
          (sim.buf.inori_burst??=[]).push(DMG.dur_inori_burst); sim.use('inori',T,ord); }},
      // 天矢乱舞: ゲージ消費なしでバースト＋40消費で2回まで再発動(最大3回)。inoriが2T後にCDリセットして解禁する。
      // 旧版はg<100ガードで実質発火しなかった(全員毎ターン100開始)。inoriのCDリセット待ちで自然にゲートされる。
      tenya: { s:90, burstTrigger:true,
        guard:(sim,T,t)=>t>=TENYA_FROM,
        exec:(sim,T,ord,bset)=>{
          const me=ownerOf('tenya'), tidx=ord.length;
          sim.use('tenya',T,ord); sim.burst(me,bset,T); T.tenya=1;
          while(T.tenya<3&&sim.g[me]>=40){
            sim.g[me]-=40; sim.burst(me,bset,T); T.tenya++;
            ord[tidx]={text:`${LABEL.tenya}×${T.tenya}(-40×${T.tenya-1})`,color:'r'};
          }
        }},
    },
    def: {
      gmax: BG.yamato_max,
      keigyoGain: 1,
      // バースト効果: 味方全体の光属性攻撃+5%(3T累積可)。自バースト毎にスタック(天矢乱舞の複数発動も各々付与)。
      // 1アシ: バーストダメージプラス(+15万/stack)を自バースト時に加算。
      onBurst: (sim) => {
        (sim.buf.yamato_elem??=[]).push(DMG.dur_yamato_elem);
        sim.dmg += (sim.buf.yamato_bplus?.length||0) * DMG.bplus_yamato;
      },
      // 自バースト性能バフ(現神の祈り倍率UP＋大和の奮起累積)をオーナー限定で burst係数に加算。
      burstBonus: (sim) => (sim.buf.inori_burst?.length?DMG.burst_inori:0)
                         + (sim.buf.funki_burst?.length||0)*DMG.burst_funki,
      // 1アシ(集いし願い): ① ヤマトがアビリティを使用した時にバーストダメージプラスバフを付与(3T累積可)。
      // ② 黄色アビの使用回数をターンを跨いで集計し、4回毎に大和の奮起を「使用可能」にする(最大3回=12回時点)。
      //    3回使用可能にした後さらに4回(計16)使用すると、ターン終了時に集計を初期化し再度使用可能になる(ループ)。
      //    1〜3回目は即時(同ターン再使用可)、4回目はターン終了時(funki_recharge予約→turnEndで反映=翌ターン解禁)。
      //    yellow_accはリセットせず永続集計。turnEndでリセットするのはfunki_cycle(使用可能化カウント)のみ。
      onAbility: (sim, name, color) => {
        if(ABIL[name]?.[0]==='yamato') (sim.buf.yamato_bplus??=[]).push(DMG.dur_bplus_yamato);
        if(color==='y'){
          sim.yellow_acc++;
          if(sim.yellow_acc % 4 === 0){
            if(sim.funki_cycle < 3){ sim.funki_cycle++; sim.cd.funki = 0; }  // 1〜3回目: 即時
            else sim.funki_recharge = true;                                   // 4回目: ターン終了時予約
          }
        }
      },
      // 1アシ再発動: 3回使用可能後の4回目到達ターン終了時にfunki_cycle(使用可能化カウント)のみリセットし再使用可。
      // yellow_acc(黄アビ累計)はリセットしない。
      turnEnd: (sim) => {
        if(sim.funki_recharge){ sim.funki_cycle = 0; sim.funki_recharge = false; sim.cd.funki = 0; }
      },
    },
  },

  tetra: {
    type: 'kamihime',
    jp: '[HELIX]テトラ', shortJp: 'テトラ', gcls: 'gt', elem: 'light',
    favWeapon: ['杖','魔導具'], baseAtk: 10110, baseHp: 1100, lvCap: 90, // Lv90解放(+3900 ATK)
    state: { helix_done: false, helix_abil_used: false },  // HELIX解禁済み / 使用済み
    abilities: {
      judg:     ['r', 10, 0],
      absolute: ['y', 10, 0],
      divinus:  ['b', 10, 0],
      helix:    ['y', 10, 0],  // テトラ4: [HELIX]テトラ / 連理魔力30以上・戦闘中1回のみ
    },
    labelSuffix: { absolute:'(+20)' },
    cdShow: { judg:"ジャッジメント", absolute:"アブソ", divinus:"ディウィヌス", helix:"HELIX" },
    cands: {
      // judg動的スコア: deploysRobot候補がCD=0で未起動なら低スコア(ロボ先行を_stepStaticで優先)。
      // ロボ起動後はdroid_buf/banoshikがjudg ph0ダメージに乗るため起動順に依存する(use()内でbuf積後に即参照)。
      judg:     { s:(sim,T)=>{ if(T.ju>=T.judgCap) return 0;
        const robotReady=Object.entries(ABIL).some(([k])=>CHAR_REGISTRY[ABIL[k][0]]?.cands?.[k]?.deploysRobot&&sim.cd[k]===0);
        return robotReady ? 30 : 80; }, guard:(sim,T)=>T.ju<T.judgCap,
                  exec:(sim,T,ord,bset)=>{ const ph=T.ju%3; sim.use('judg',T,ord); T.ju++;
                    // ジャッジ循環: ph0=敵全体10回ダメージ / ph1=バースト発動 / ph2=通常攻撃
                    if(ph===0){ const royAbi=sim.buf.roy?.length ? 10*sim._na()*DMG.roy_abi_frac[sim.roy_tier??0] : 0;
                      // アビダメ枠: ×(1+abi_dmg+droid)、1ヒット減衰 基準judg_cap×(1+droid)(超過は1/25で逓減)
                      // amplifa(+10万)はロボ反応ダメージ専用のためジャッジには加算しない。
                      const db0=sim._droidAbiBuf();
                      const hit=sim._decay('abi', sim._na()*DMG.judg_mult*(1+GEAR.abi_dmg+db0.dmg), DMG.judg_cap*(1+db0.cap));
                      sim.dmg += 10*hit + royAbi; }
                    else if(ph===1) sim.burst(ownerOf('judg'),bset,T);
                    else sim.dmg += sim._decay('na', sim._na()*(1+GEAR.na_dmg)); }},
      absolute: { s:130, atkBuf:true, partyBG:true, exec:(sim,T,ord)=>{ if(!sim.buf.absolute)sim.buf.absolute=[]; sim.buf.absolute.push(DMG.dur_absolute); sim.addG(CHARS,BG.absolute); sim.use('absolute',T,ord); }},
      // ディウィヌス: 敵防御-30%(defdown・後続全攻撃を底上げ)＋DOT4種(順序非依存・turnEndでtick)。
      divinus:  { s:90, atkBuf:true, exec:(sim,T,ord)=>{
                  (sim.buf.divinus_def??=[]).push(DMG.dur_divinus_def);
                  (sim.buf.divinus_dot??=[]).push(DMG.dur_divinus_dot); sim.use('divinus',T,ord); }},
      // ゴッド・オムニポンテス: 全体BG+100。連理魔力30以上かつ戦闘中1回のみ。
      helix:    { s:400, atkBuf:true, partyBG:true,
                  guard:(sim)=>sim.renri>=30&&!sim.helix_abil_used,
                  exec:(sim,T,ord)=>{ sim.helix_abil_used=true; sim.addG(CHARS,100); sim.use('helix',T,ord); }},
    },
    def: {
      gmax: BG.other_max,
      keigyoGain: 1,
      // HELIX(テトラ4)は連理魔力30で解禁。目的関数は renri をここまで評価し超過分は追わない。
      milestones: { renri: 30 },
      // HELIX解禁検出(初回到達ターン表示用)。doneKeyは自前state。
      helix: { reached: s=>s.renri>=30, doneKey: 'helix_done' },
      onBurst: (sim, atk, owner) => {
        const skip = atk ? [] : ['judg'];
        for(const k of Object.keys(sim.cd)){
          if(ABIL[k]?.[0] !== owner) continue;
          if(skip.includes(k)) continue;
          if(sim.cd[k]>0) sim.cd[k]--;
        }
      },
      // ディウィヌスDOT: 有効ターン毎に4種×min(敵最大HP×10%, 上限10万)を概算加算(順序非依存)。
      turnEnd: (sim) => { if(sim.buf.divinus_dot?.length)
        sim.dmg += DMG.divinus_dot_types*Math.min(DMG.enemy_max_hp*0.10, DMG.divinus_dot_cap); },
    },
  },

  napoleon: {
    type: 'hero',
    jp: 'ナポレオン', gcls: 'ge', elem: null,
    favWeapon: ['剣','銃'], lvUpAtk: 400,
    // aura: 英雄の闘気(エキープ・ベニフィッシで蓄積、ベタイアがターン終了時に消費)
    // betaia2: ファクター・ディシジフによるベタイア2回発動状態の残ターン
    state: { aura: 0, betaia2: 0, roy_tier: 0 },
    abilities: {
      roy:     ['y', 3, 0],
      pike:    ['y', 3, 0],
      consort: ['r', 3, 0],
      factor:  ['y', 9, 0],
    },
    labelSuffix: { factor:'(全CD-1)' },
    cdShow: { roy:"ロワ・クモンド", pike:"パイク", consort:"アーティオリ", factor:"ディシジフ" },
    cands: {
      // ロワ・クモンド: バフ数tierに応じ全攻撃ダメージプラス(2T)。tier確定後にbuf追加。
      roy:     { atkBuf:true, exec:(sim,T,ord)=>{ const bc=buffCount(sim);
                   sim.roy_tier = bc>=16?3:bc>=11?2:bc>=6?1:0;
                   (sim.buf.roy??=[]).push(DMG.dur_roy); sim.use('roy',T,ord); }},
      // パイク: 旺盛・防壁(2T)。自身のバフ2個を含めてバフ15以上で急所・会心付与追加。
      pike:    { atkBuf:true, exec:(sim,T,ord)=>{ (sim.buf.pike??=[]).push(DMG.dur_pike);
                   (sim.buf.pike_def??=[]).push(DMG.dur_pike);
                   if(buffCount(sim)>=15) (sim.buf.pike_crit??=[]).push(DMG.dur_pike);
                   sim.use('pike',T,ord); }},
      // アーティオリ: (2+0.5×バフ数)倍のダメージ(上限250万)。防御DOWN(6T累積可)。バフ20以上で2回。
      consort: { exec:(sim,T,ord)=>{ sim._naOwner=ownerOf('consort'); const bc=buffCount(sim); const hits=bc>=20?2:1;
                   const mult=2+0.5*bc;
                   // アビダメ枠: ×(1+abi_dmg+droid)、減衰 基準consort_cap×(1+droid)(超過は1/25で逓減)
                   const dbc=sim._droidAbiBuf();
                   for(let i=0;i<hits;i++) sim.dmg+=sim._decay('abi', sim._na()*mult*(1+GEAR.abi_dmg+dbc.dmg), DMG.consort_cap*(1+dbc.cap));
                   for(let i=0;i<hits;i++) (sim.buf.consort_def??=[]).push(DMG.dur_consort_def);
                   sim.use('consort',T,ord,hits===2?'(×2)':''); }},
      // ディシジフ: ベタイア2回発動化(2T)。バフ10以上で全体アビCD-1・BG+30追加。
      factor:  { partyBG:true, exec:(sim,T,ord)=>{ sim.betaia2=DMG.dur_factor;
                   if(buffCount(sim)>=10){
                     for(const k of Object.keys(sim.cd)) if(k!=='factor'&&sim.cd[k]>0) sim.cd[k]--;
                     sim.addG(CHARS,DMG.factor_bg);
                   }
                   sim.use('factor',T,ord); }},
    },
    def: {
      gmax: BG.other_max,
      keigyoGain: 3,
      // エキープ・ベニフィッシ: 味方の強化系アビ(atkBufタグ)毎に闘気+1
      onAbility: (sim, name) => { if(CHAR_REGISTRY[ownerOf(name)]?.cands?.[name]?.atkBuf) sim.aura++; },
      // ベタイア・コンヴェフティ: ターン終了時に闘気を消費(闘気1個=1ヒット×3倍・上限50万)
      // ファクター発動中(betaia2>0)は2回発動。BG+3×闘気も同様。
      turnEnd: (sim) => {
        const times = sim.betaia2>0 ? 2 : 1;
        if(sim.aura>0){
          sim.addG(CHARS, DMG.betaia_bg_per_aura*sim.aura*times);
          for(let i=0;i<sim.aura*times;i++)
            sim.dmg += Math.min(sim._na()*DMG.betaia_mult, DMG.betaia_cap);
          sim.aura=0;
        }
        if(sim.betaia2>0) sim.betaia2--;
      },
    },
  },
};

// ===== 編成グローバル（buildFormationで構築） =====
// ABIL形式: [owner, color, cd, keigyo_cost]
let CHARS, LEADER, JP, JP_SHORT, GCLS, ABIL, CHAR_DEF, LABEL_SUFFIX, LABEL, CD_SHOW;
// CHAR_SIM_STATES: 編成キャラの state フィールドを合流させたマスター初期値。
// Sim の constructor/snap/clone がこれを参照して自動管理する。
let CHAR_SIM_STATES = {};
// MILESTONES: 編成キャラが宣言した目的関数マイルストーン。
// def.milestones の同一キーは最大値で集約（例: renri はHELIX解禁閾値30）。
// 目的関数はこの値で頭打ち評価し、解禁後の超過分を無駄に追わない。
let MILESTONES = {};
// ELEM: 各キャラの実効属性 {charKey: 'light'|null}。
// 英霊(elem:null)はウェポン依存のため編成の主属性(神姫の最多属性)を採用する。
// elemCount(e)が「編成内のe属性キャラ数」(英霊込み)を返す共通ヘルパ。
let ELEM = {};
const ownerOf = k => ABIL[k][0];
const elemCount = e => CHARS.filter(c=>ELEM[c]===e).length;

function buildFormation(heroKey, kamihimeKeys) {
  LEADER = heroKey;
  CHARS  = [heroKey, ...kamihimeKeys];
  JP = {}; JP_SHORT = {}; GCLS = {};
  // jp=正式名称(編成identity表示用) / shortJp=略称(アビチップ・ゲージ等の密な表示用・省略時jp)
  for(const c of CHARS){ JP[c]=CHAR_REGISTRY[c].jp; JP_SHORT[c]=CHAR_REGISTRY[c].shortJp||CHAR_REGISTRY[c].jp; GCLS[c]=CHAR_REGISTRY[c].gcls; }
  // 実効属性: 神姫はelem宣言値、英霊(null)は神姫の最多属性に追従
  const tally = {};
  for(const c of kamihimeKeys) tally[CHAR_REGISTRY[c].elem]=(tally[CHAR_REGISTRY[c].elem]||0)+1;
  const mainElem = Object.entries(tally).sort((a,b)=>b[1]-a[1])[0]?.[0] ?? null;
  ELEM = Object.fromEntries(CHARS.map(c=>[c, CHAR_REGISTRY[c].elem ?? mainElem]));
  ABIL = {};
  for(const c of CHARS)
    for(const [k,[col,cd,kc]] of Object.entries(CHAR_REGISTRY[c].abilities))
      ABIL[k]=[c,col,cd,kc];
  LABEL_SUFFIX = {};
  for(const c of CHARS) Object.assign(LABEL_SUFFIX, CHAR_REGISTRY[c].labelSuffix);
  const cnt={};
  LABEL = Object.fromEntries(Object.entries(ABIL).map(([k,[owner]])=>{
    cnt[owner]=(cnt[owner]||0)+1;
    return [k, `${JP_SHORT[owner]}${cnt[owner]}${LABEL_SUFFIX[k]||''}`];
  }));
  CHAR_DEF = {};
  for(const c of CHARS) CHAR_DEF[c]=CHAR_REGISTRY[c].def;
  CD_SHOW = {};
  for(const c of CHARS) Object.assign(CD_SHOW, CHAR_REGISTRY[c].cdShow);
  // キャラ固有 sim 状態の初期値を集約（新キャラ追加時は CHAR_REGISTRY[c].state に記述するだけ）
  CHAR_SIM_STATES = Object.fromEntries(
    CHARS.flatMap(c => Object.entries(CHAR_REGISTRY[c].state ?? {}))
  );
  // 目的関数マイルストーンを集約（同一キーは最大値を採用）
  MILESTONES = {};
  for(const c of CHARS)
    for(const [k,v] of Object.entries(CHAR_REGISTRY[c].def.milestones ?? {}))
      MILESTONES[k] = Math.max(MILESTONES[k] ?? -Infinity, v);
}

// 候補スコア自動算出: s を省略したアビに対して構造的特徴から標準スコアを導出する。
// 既存の明示的 s 値はそのまま上書き優先。
function computeBaseScore(key, cand) {
  const [,col, cd, kc] = ABIL[key];
  // グループ基準: atkBuf=300(バフ先行) > default=100 > burstTrigger=50(後置)
  let s = cand.atkBuf ? 300 : cand.burstTrigger ? 50 : 100;
  // 色補正: 黄(確実高効果)+15 / 青(サブ効果)+5 / 赤(誘発多い)−5 / 白(コスト高い)−15
  s += { y: 15, b: 5, r: -5, w: -15 }[col] ?? 0;
  if (cand.partyBG)      s += 10;  // 全体BG増加: 早めに打つとBG恩恵が次の行動に波及
  if (cand.deploysRobot) s += 20;  // ロボ展開: 毎バーストBG+5が早いほど総獲得量が増える
  s -= (kc ?? 0) * 5;              // 契晶コスト: 高いほど使いにくい
  if (cd >= 10) s += 5;            // 長CDアビ: 早く使うほど次回使用機会が増える
  if (cd === 0)  s -= 10;          // CD=0 即再使用アビ: 引きつけ可能なためやや後回し
  return Math.max(s, 1);
}

// ===== SIM ENGINE =====
class Sim {
  constructor() {
    this.g=Object.fromEntries(CHARS.map(c=>[c,BG.other_max]));
    this.cd=Object.fromEntries(Object.keys(ABIL).map(k=>[k,0]));
    // エンジン共通変数（キャラ非依存）
    this.keigyo=4; this.cum=4; this.renri=0;
    this.mooncode=2; this.mburst=0; this.totalTurns=10; this.planDepth=0;
    // 概算火力モデル: バフ期間管理辞書と総ダメージ累計
    // buf = {abilityKey: [remaining_turns, ...]}  スタック毎に残りターン数を管理。
    // tick() でデクリメント・失効削除。_na() がbufから動的に乗数を計算する。
    this.dmg=0; this.buf={};
    this.gmax=Object.fromEntries(CHARS.map(c=>[c,CHAR_DEF[c].gmax??BG.other_max]));
    // キャラ固有状態変数（CHAR_REGISTRY[c].state から自動展開）
    for(const [k,v] of Object.entries(CHAR_SIM_STATES)) this[k]=v;
  }

  tick() {
    for(const k of Object.keys(this.cd)) if(this.cd[k]>0) this.cd[k]--;
    if(this.droid>0) this.droid--;
    if(this.banoshik_robot>0) this.banoshik_robot--;
    if(this.mooncode>0) this.mooncode--;
    // バフ残ターンをデクリメントし失効スタックを除去
    for(const k of Object.keys(this.buf)){
      this.buf[k]=this.buf[k].map(x=>x-1).filter(x=>x>0);
      if(!this.buf[k].length) delete this.buf[k];
    }
  }

  addG(targets, amt, excl=null) {
    for(const c of targets){
      if(excl&&excl.has(c)) continue;
      this.g[c]=Math.min(this.g[c]+amt, this.gmax[c]);
    }
  }

  grif(owner) {
    const gain = CHAR_DEF[owner].keigyoGain;
    this.keigyo=Math.min(this.keigyo+gain, KEIGYO_MAX);
    this.cum+=gain;
  }

  procR(T, channel) {
    // コヴァレント・アルカナ(連理魔力+ジャッジ再発動)はテトラのアシスト。テトラ不在編成では発火しない。
    if(ABIL.judg){
      const crossed=(
        (channel==='b'&&T.burst>0&&T.burst%2===0)||
        (channel==='a'&&T.ability>0&&T.ability%12===0)
      );
      // procは同ターン上限RENRI_CAP(5回)。1procが連理魔力+1＆ジャッジ即使用可を同時付与。
      // 3チャネル(abi/12・burst/2・通常攻撃/9)を合算してカウント。
      if(crossed && T.proc<RENRI_CAP){
        T.proc++; if(this.renri<RENRI_MAX) this.renri++; // 連理魔力は RENRI_MAX で頭打ち(実機検証)
        // ジャッジ再発動は二値制御(非蓄積): judg CD中のみリセット。アイドル中(CD=0)は捨てる。
        // リキャストは連理魔力上限到達後も継続処理する。
        if(this.cd.judg>0) this.cd.judg=0;
      }
    }
    // ムーンコードはヘカテーのアシスト。ヘカテー不在編成では発火しない。
    if(ABIL.effond && channel==='a'&&T.ability>0&&T.ability%12===0) this.mooncode=2;
  }

  // 減衰(上限)モデル: 計算ダメージ raw → 実ダメージ。区分線形で寄与率(slope)を逓減する。
  // frame: 'na'(35/45/55万・1→½→¼→⅛) / 'burst'(100万・1→1/10) / 'abi'(base=キャラ毎・1→1/25)
  //        / 'hard'(追撃/城塞・寄与率0=完全頭打ち)。上限UP(GEAR.<frame>_cap)は第一上限を×(1+up)。
  // 抽象スケールでは raw≪上限のため恒等(休眠)。base_atk等を実ダメ較正すると自動で減衰が効く基盤。
  // 攻撃ロボ(droid_buf): 赤アビ反応毎のアビダメ枠加算(累積可・各スタック dur_droid_buf 持続)
  _droidAbiBuf(){ const n=this.buf.droid_buf?.length||0; return {dmg:n*DMG.abi_dmg_droid, cap:n*DMG.abi_cap_droid}; }

  _decay(frame, raw, base){
    const up = GEAR[frame+'_cap']||0;
    if(frame==='na'){
      const p=DMG.decay_na, c1=p.cap1*(1+up), s=p.slope, o=p.off;
      const T0=c1, T1=T0+(o[1]-o[0])/s[1], T2=T1+(o[2]-o[1])/s[2]; // 実ダメ差分→raw閾値に換算
      if(raw<=T0) return raw;
      if(raw<=T1) return c1+o[0]+(raw-T0)*s[1];
      if(raw<=T2) return c1+o[1]+(raw-T1)*s[2];
      return c1+o[2]+(raw-T2)*s[3];
    }
    if(frame==='burst'){
      const c1=DMG.decay_burst.cap1*(1+up);
      return raw<=c1 ? raw : c1+(raw-c1)*DMG.decay_burst.slope;
    }
    if(frame==='streak'){
      // バーストストリーク専用減衰(5人時): cap1=750万/cap2=1000万(実ダメ)・slope1=0.25/slope2=0.40
      const d=DMG.decay_streak, c1=d.cap1, c2=d.cap2;
      // zone2のraw上限: cap1 + (cap2-cap1)/slope1(=実ダメがc2になるときのraw)
      const T2=c1+(c2-c1)/d.slope1;
      if(raw<=c1) return raw;
      if(raw<=T2) return c1+(raw-c1)*d.slope1;
      return c2+(raw-T2)*d.slope2;
    }
    if(frame==='abi'){
      const c1=(base??Infinity)*(1+up);
      return raw<=c1 ? raw : c1+(raw-c1)*DMG.decay_abi_slope;
    }
    return Math.min(raw, (base??Infinity)*(1+up)); // hard(追撃/城塞): 寄与率0
  }

  // 概算通常攻撃ダメージ(中央値): バフ期間管理辞書(buf)から動的に枠を計算する。
  // 各バフキーのスタック数が実効枠値を決定し、失効スタックは tick() で除去済み。
  // ※ フレーム別ダメージUP(na_dmg/abi_dmg/burst_dmg)は base に含めず、各フレームの加算点で乗じる。
  // exclTech=true: テクニカ枠を割り戻した通常攻撃ダメージ(バースト基準=「通常攻撃ダメ(テクニカ除く)」)。
  // technicaはgkに(1+technica)で畳まれ base/royFlat 双方へ線形比例するため、戻り値の除算で厳密に除外できる。
  _na(exclTech=false){
    const D=DMG, b=this.buf, G=GEAR;
    const nAbs=b.absolute?.length||0, nPuv=b.puvoir?.length||0;
    const nBan=b.banoshik?.length||0, nLeg=b.legend?.length||0;
    const nPikeCrit=b.pike_crit?.length||0;
    // アサルト枠: banoshik/absolute + legend(契晶) + 装備
    const aslt = nBan*D.assault_banoshik + nAbs*D.assault_absolute
               + (b.leg_aslt?D.assault_legend:0) + G.assault;
    // 属性値枠: 属性相性(affinity・実機式では枠内に加算) + puvoir(光) + ヤマトバースト + 装備。
    // 実機式の属性枠 = (属性相性 + 属性値UP幻獣 + 属性値 + 属性バフ + アシスト)。先頭1+ではなくaffinityが基底。
    const nYel=b.yamato_elem?.length||0;
    const elemBox = D.affinity + nPuv*D.elem_puvoir + nYel*D.elem_yamato + G.elem;
    // 旺盛枠: absolute/leg_vigor/pike(光) + 装備。+100%上限(フルHP前提)
    const vigor = Math.min(
      (nAbs>0?D.vigor_absolute:0)+(b.leg_vigor?D.vigor_legend:0)
      +(b.pike?.length>0?D.vigor_pike:0)+G.vigor, 1.0);
    // 会心枠: ARRIVE永続 + absolute + 装備
    const critRate = Math.min(D.crit_rate_arrive + nAbs*D.crit_rate_absolute + G.crit_rate, 1.0);
    const crit = critRate*D.crit_mult;
    // 急所枠: 光(puvoir/absolute/legend/pike_crit) + 装備
    const acute = nPuv*D.acute_puvoir + nAbs*D.acute_absolute + nLeg*D.acute_legend
                + nPikeCrit*D.acute_pike_crit + G.acute;
    // 特殊攻撃枠: leg_spec(光) + 装備
    const spec = (b.leg_spec?D.spec_legend:0)+G.spec;
    // GEAR_K or per-character GEAR_K_C[owner] (武器マスタ設定時)
    const gk = (this._naOwner && GEAR_K_C[this._naOwner]) || GEAR_K;
    const base = gk*(1+aslt)*elemBox*(1+vigor)*(1+crit)*(1+acute)*(1+spec);
    // ロワ・クモンド: 独立枠フラット(tierはbuf使用時に確定・base比率で近似)
    const royFlat = (b.roy?.length||0)*base*D.roy_na_frac[this.roy_tier??0];
    // 防御DOWN: 敵防御/耐性DOWN各ソース合算 → 上限50%(実機: 防御down合計50%で下限・以降切捨)。
    // 実機は敵防御の除数補正だが、枠の概念は追わず暫定的に上限50%の加算近似とする。
    const defdown = Math.min(
      (b.consort_def?.length||0)*D.defdown_consort
    + (b.divinus_def?.length||0)*D.defdown_divinus, 0.50);
    const res = (base + royFlat) * (1 + defdown);
    return exclTech ? res/(1+G.technica) : res;
  }

  burst(owner, bset, T, atk=false) {
    this._naOwner = owner; // バーストダメージはオーナーのGEAR_K_Cを参照
    this.addG(CHARS.filter(c=>c!==owner), BG.cascade, atk?bset:null);
    this.grif(owner); T.burst++;
    // 概算バーストダメージ: absolute(バーストダメUP) + nights(敵バースト耐性DOWN≒バーストダメUP)
    const bdmg = (this.buf.absolute?.length||0)*DMG.burst_dmg_absolute
               + (this.buf.nights?.length||0)*DMG.burst_dmg_nights;
    // バースト基準は「通常攻撃ダメ(テクニカ除く)」。_na(true)でテクニカ枠を割り戻す。
    const naB = this._na(true);
    // ロワ・クモンド: バーストプラス(独自枠・味方全体付与のため全員のバーストに加算・上限の外)
    const royBurst = this.buf.roy?.length ? naB*DMG.roy_burst_frac[this.roy_tier??0] : 0;
    // オーナー固有のバースト性能ボーナス(自バフ・CHAR_DEF.burstBonusに集約。例: ヤマト現神/奮起)
    const selfBonus = CHAR_DEF[owner].burstBonus?.(this) || 0;
    // バーストダメージ式: 通常攻撃ダメ(テクニカ除く) × (a + バーストダメUP効果 + 自バフ) + b(定数フラット)。
    // b は乗算枠の外のフラット加算(SSR固定=2500)。ウェポンburst_dmgは係数aスロットに加算。
    const core = this._decay('burst', naB*(DMG.burst_coef_a + bdmg + GEAR.burst_dmg + selfBonus) + DMG.burst_coef_b);
    this.dmg += core + royBurst;
    if(atk) bset.add(owner);
    // 連理魔力(コヴァレント): バースト2回毎に+1＆ジャッジ即使用可。攻撃フェーズのバーストも対象
    this.procR(T,'b');
    // キャラ固有のバースト時処理（CHAR_DEF記述子に集約）
    CHAR_DEF[owner].onBurst?.(this, atk, owner);
    // パーティ全体のバースト監視フック（他キャラのバーストにも反応する機構用）
    for(const c of CHARS) CHAR_DEF[c].onPartyBurst?.(this, owner, T, atk);
    // モビウスムーンズ: party burst 5回毎にヘカテー(=黄ドレイン所有者)のアビCD全リセット
    this.mburst++;
    if(ABIL.puvoir && this.mburst%5===0){
      const ho=ownerOf('puvoir');
      for(const k of Object.keys(ABIL)) if(ownerOf(k)===ho) this.cd[k]=0;
      T.mobius=(T.mobius||0)+1;
    }
  }

  use(name, T, ord, note='') {
    this._naOwner = ownerOf(name); // _na()がアビ所有者のGEAR_K_Cを参照するよう設定
    const [,color,cd,cost]=ABIL[name];
    this.cd[name]=cd; if(cost) this.keigyo-=cost; T.ability++;
    // ロボ作動カウント: 攻撃ロボ(droid)=赤アビ反応 / 補助ロボ(banoshik_robot)=黄アビ反応
    if(color==='r'&&this.droid>0){
      T.ra++;
      // 攻撃ロボ反応: 赤アビ発動毎に敵全体へ反応ダメージ＋味方全体アビダメバフ付与(累積可)。
      // アンプリファ(3T): ロボ反応ダメージに固定+10万フラット加算(減衰外・ロボ反応のみ対象)。
      const ampFlat = this.buf.amplifa_buf?.length ? DMG.amplifa_flat : 0;
      this.dmg += this._decay('abi', this._na()*DMG.droid_react_mult, DMG.droid_react_cap) + ampFlat;
      (this.buf.droid_buf??=[]).push(DMG.dur_droid_buf);
    }
    if(color==='y'&&this.banoshik_robot>0) T.ra++;
    // バノーシク: 補助ロボ作動中の黄アビ毎にアサルトバフを独立付与(上限なし累積・各 dur_banoshik 持続)
    if(color==='y'&&this.banoshik_robot>0) (this.buf.banoshik??=[]).push(DMG.dur_banoshik);
    this.procR(T,'a');
    // パーティ全体のアビ使用監視フック（ナポレオン闘気等）
    for(const c of CHARS) CHAR_DEF[c].onAbility?.(this, name, color, T);
    ord.push({text:LABEL[name]+(note||''), color});
  }



  // 公開API: ロールアウト探索エンジンへ委譲
  takeTurn(t) {
    return this.greedyTakeTurn(t);
  }

  // ===== ロールアウト探索エンジン =====
  // 各ステップで「合法な候補アビ」を列挙し、実行時は候補ごとにcloneして
  // ターン完遂＋将来ROLL_LAターンをシミュレートし、目的関数で採点して最良を選ぶ。
  // 静的スコア(s)はロールアウト内の既定ポリシー＆同点時のタイブレークに用いる。
  // フェイズ概念は廃止。色順序は静的スコアの大小(黄>青>赤)で既定ポリシーが担保する。

  // 合法候補の列挙。各候補は {s:静的スコア, key:識別子, col:色, exec:適用関数}。
  // CHAR_REGISTRY[owner].cands[key] の定義を読み取って汎用的に生成する。
  // 新キャラ追加時はCHAR_REGISTRYのcandsにエントリを追加するだけでよい。
  _candidates(){
    const sim=this, T=this.T, ord=this.ord, bset=this.bset, t=this._t;
    const c=[];
    for(const [key,[owner,col,,kc]] of Object.entries(ABIL)){
      if(sim.cd[key]!==0) continue;
      if(kc&&sim.keigyo<kc) continue;
      const cand=CHAR_REGISTRY[owner]?.cands?.[key];
      if(!cand) continue;
      if(cand.guard&&!cand.guard(sim,T,t)) continue;
      const s=typeof cand.s==='function'?cand.s(sim,T,t):(cand.s??computeBaseScore(key,cand));
      const exec=cand.exec?()=>cand.exec(sim,T,ord,bset,t):()=>sim.use(key,T,ord);
      c.push({s,key,col,exec,deploysRobot:!!cand.deploysRobot,prelude:!!cand.prelude});
    }
    return c;
  }

  // 静的ポリシーで1ステップ実行（ロールアウト内の既定ポリシー）。候補が無ければfalse。
  _stepStatic(){
    const c=this._candidates(); if(!c.length) return false;
    c.reduce((a,b)=>b.s>a.s?b:a).exec(); return true;
  }

  // key一致の候補をクローン上で実行（exec内のthisはクローン）。
  _execKey(key){ const m=this._candidates().find(x=>x.key===key); if(m) m.exec(); }

  // 攻撃フェイズ: ゲージ100以上のキャラがバーストするだけ。アビリティ発動は一切なし。
  // procによるjudg arm（cd=0）は次ターンへ持ち越し。
  _attackPhase(){
    const atk=[]; const before=this.dmg;
    for(const c of CHARS){
      if(this.g[c]>=FB_THR){ this.g[c]-=100; this.burst(c,this.bset,this.T,true); atk.push(c); }
    }
    // バーストストリーク: フルバースト(5人)時。raw=バースト合計×参加人数補正(0.5)→2段減衰。
    // 減衰値: 第一750万/第二1000万(実ダメ)・第一超×0.25・第二超×0.40(有志検証)。
    if(atk.length===5) this.dmg += this._decay('streak', (this.dmg-before)*DMG.burst_streak);
    return atk;
  }

  // ターン終了時の状態更新（結果オブジェクトは作らない）。
  _endBookkeep(t){
    this.addG(CHARS, MACH_BG*this.T.ra);
    for(const c of CHARS) CHAR_DEF[c].turnEnd?.(this, this.T);
    if(t%4===0){ this.keigyo=Math.min(this.keigyo+5,KEIGYO_MAX); this.cum+=5; }
    // inori_p はヤマト固有状態(不在編成では undefined → != でスキップ)
    if(this.inori_p!=null){ this.inori_p++; if(this.inori_p===2){ this.cd.tenya=0; this.inori_p=null; } }
    // HELIX解禁の既達マーク(def.helix宣言キャラのみ・初回到達ターン検出用)
    for(const c of CHARS){ const h=CHAR_DEF[c].helix; if(h&&h.reached(this)) this[h.doneKey]=true; }
  }

  // 現在のターン状態から静的ポリシーで残りを完遂（クローン上で使用）。this._atkを設定。
  _finishStatic(){
    for(let i=0;i<300;i++){ if(!this._stepStatic()) break; }
    this._atk=this._attackPhase();
    this._endBookkeep(this._t);
  }

  // 目的関数: 現ターン(完遂済み)＋残り全ターンを評価し
  // [FB数, 総バースト, 総ジャッジ, 連理魔力, 累積契晶, 現在契晶] を返す（辞書式で大きいほど良い）。
  // 連理魔力・契晶を分離して各マイルストーン（HELIX解禁・pactcore使用可）を独立評価。
  _objective(t0){
    let fbTurns=(this._atk.length===5)?1:0;
    let totalBurst=this.T.burst;
    let totalJudg=this.T.ju;
    const la=this.totalTurns-t0;
    for(let k=1;k<=la;k++){
      const r=this.greedyTakeTurn(t0+k); // planDepth>=2 → 静的、planDepth=1 → 内部ビーム
      if(r.atk.length===5) fbTurns++;
      totalBurst+=r.burst;
      totalJudg+=r.ju;
    }
    // マイルストーン汎用評価: 編成キャラが宣言した {状態変数キー: 上限} を合算。
    // 各変数は上限まで評価し超過分は追わない(例: renri30=テトラHELIX)。
    const renriObj = Object.entries(MILESTONES)
      .reduce((a,[k,cap])=>a+Math.min(this[k]??0,cap), 0);
    // 最上位目標は概算総ダメージ(ロールアウト終了時点の this.dmg 累積値)。
    // float 比較ノイズを避けるため整数化。以降は従来のFB/バースト系を補助指標として保持。
    return [Math.round(this.dmg), fbTurns, totalBurst, totalJudg, renriObj, this.cum, this.keigyo];
  }

  // 先読みガードのキャッシュを一括計算し T['_la_'+key] に格納。
  // ビームクローンはTをコピーするため、ビーム開始前に1回呼べば全クローンに伝播する。
  _primeLookaheads(t){
    for(const [key,[owner]] of Object.entries(ABIL)){
      if(this.cd[key]!==0) continue;
      const cand=CHAR_REGISTRY[owner]?.cands?.[key];
      if(!cand?.lookahead) continue;
      if(this.T['_la_'+key]!==null) continue;
      const look=this.clone(); // planDepth+1 のクローンで評価（再帰深度+1）
      this.T['_la_'+key]=cand.lookahead(look,t);
    }
  }

  // ビームサーチ: beamW本の仮想シムを並列維持し最良アビ順序列を返す。
  // 各ステップで全候補をcloneして展開 → _finishStatic()+_objective()で採点 → 上位beamW保持。
  // planDepth=0(本ターン)はBEAM_W、planDepth=1(ロールアウト内)はBEAM_W_INNERで呼ばれる。
  // forcedPrefix: 探索開始前に強制実行するキー列(ルート分散ワーカーが異なる開幕を強制するために使う)。
  _beamSearch(beamW, forcedPrefix=[]){
    const evalEntry=e=>{
      const cl=e.sim.clone(); cl._finishStatic(); e.obj=cl._objective(this._t);
    };
    const seed=this.clone();
    for(const k of forcedPrefix) seed._execKey(k);
    let beam=[{sim:seed, keys:[...forcedPrefix], obj:null}];
    evalEntry(beam[0]);
    for(let step=0;step<300;step++){
      const next=[]; let anyLive=false;
      for(const entry of beam){
        const cands=entry.sim._candidates();
        if(!cands.length){ next.push(entry); continue; }
        anyLive=true;
        for(const cand of cands){
          const cl=entry.sim.clone(); cl._execKey(cand.key);
          const child={sim:cl, keys:[...entry.keys,cand.key], obj:null};
          evalEntry(child); next.push(child);
        }
      }
      if(!anyLive) break;
      next.sort((a,b)=>cmpVec(b.obj,a.obj)); beam=next.slice(0,beamW);
    }
    return beam[0]?.keys??[];
  }

  greedyTakeTurn(t) {
    this._beginTurn(t);
    // planDepth=0: 本ターン(フルビーム) / planDepth=1: ロールアウト(内部ビーム) / >=2: 静的greedy
    if(this.planDepth>=2){
      for(let i=0;i<300;i++) if(!this._stepStatic()) break;
    } else {
      this._primeLookaheads(t);
      // forcePrefix: ルート分散ワーカーが本ターン(t===_forceTurn)の開幕だけ強制する。
      // 内部ロールアウトのクローンには伝播しない(clone()がコピーしない独自フィールドのため)。
      const fp=(this.planDepth===0 && this._forcePrefix && t===this._forceTurn) ? this._forcePrefix : [];
      const keys=this._beamSearch(this.planDepth===1?BEAM_W_INNER:BEAM_W, fp);
      for(const key of keys) this._execKey(key);
    }
    const atk=this._attackPhase();
    const T=this.T, ord=this.ord;
    const rt=T.proc;
    // HELIX解禁(初回到達ターンのみtrue): def.helix 宣言キャラの閾値到達を汎用検出
    const helix=CHARS.some(c=>{ const h=CHAR_DEF[c].helix; return h&&h.reached(this)&&!this[h.doneKey]; });
    this._endBookkeep(t); // ここでhelix_done=trueに更新
    return {t,ord,atk,full:atk.length===5,burst:T.burst,ability:T.ability,ra:T.ra,ju:T.ju,
      mobius_this:T.mobius,rt,renri:this.renri,keigyo:this.keigyo,cum:this.cum,
      mooncode:this.mooncode,ycount:this.ycount,helix,droid:this.droid,banoshik_robot:this.banoshik_robot,
      dmg:this.dmg,gauge:{...this.g},state:this.snap()};
  }

  _beginTurn(t){
    this.tick();
    this.T={ability:0,burst:0,proc:0,ra:0,tenya:0,
            ju:0,mobius:0,legend:0,pactcoreUsed:false,alone:0,knightsUsed:false};
    // lookaheadフックを持つアビのキャッシュスロットをnullで初期化（_primeLookaheadsで埋める）
    for(const [key,[owner]] of Object.entries(ABIL)){
      const cand=CHAR_REGISTRY[owner]?.cands?.[key];
      if(cand?.lookahead) this.T['_la_'+key]=null;
    }
    this.T.judgCap = JUDG_REACT + (this.cd.judg===0 ? 1 : 0);
    this.ord=[]; this.bset=new Set(); this._t=t;
  }

  snap(){
    const cs=Object.fromEntries(Object.keys(CHAR_SIM_STATES).map(k=>[k,this[k]]));
    const buf=Object.fromEntries(Object.entries(this.buf).map(([k,v])=>[k,[...v]]));
    return{g:{...this.g},cd:{...this.cd},keigyo:this.keigyo,cum:this.cum,
      renri:this.renri,mooncode:this.mooncode,mburst:this.mburst,
      dmg:this.dmg,buf,...cs};
  }

  // 先読み/ロールアウト用の複製。planDepth+1 で深度管理し再帰を防ぐ。
  // ターン途中(this.T存在)ならターンローカル状態も複製し、続きをクローン上で完遂できるようにする。
  clone(){
    const s=new Sim(); const snap=this.snap();
    s.g={...snap.g}; s.cd={...snap.cd};
    s.keigyo=snap.keigyo; s.cum=snap.cum; s.renri=snap.renri;
    s.mooncode=snap.mooncode; s.mburst=snap.mburst;
    s.dmg=snap.dmg; s.buf=Object.fromEntries(Object.entries(snap.buf).map(([k,v])=>[k,[...v]]));
    for(const k of Object.keys(CHAR_SIM_STATES)) s[k]=snap[k];
    s.totalTurns=this.totalTurns; s.planDepth=this.planDepth+1;
    if(this.T){ s.T={...this.T}; s.ord=this.ord.slice(); s.bset=new Set(this.bset); s._t=this._t; }
    return s;
  }
}

// 辞書式ベクトル比較: a>b なら正・a<b なら負・等しければ0
function cmpVec(a,b){
  for(let i=0;i<a.length;i++){ if(a[i]!==b[i]) return a[i]>b[i]?1:-1; }
  return 0;
}

// ルート分散(並列ワーカー)用: T1開幕の強制プレフィックス候補を汎用的に列挙する。
// ビーム本体のカット(BEAM_W)は「今すぐの価値が低いが後続の押し順次第で伸びる」候補
// (例: 補助ロボ起動→直後に黄アビ連打、のような複数手のシナジー)を early に切り落とすため、
// 候補ごとに開幕を強制した独立ビームを並列に走らせ、最終ダメージ最大のものを採用する。
// CHAR_REGISTRYの`deploysRobot`タグ(キャラ名リテラル不使用)を持つ候補同士は2手の順序組も列挙し、
// 同ターン複数ギミックの起動順シナジーも拾う。
// さらに`prelude`タグ(deploysRobot後に使うと火力を底上げするアビ)とのペア/3手順列も列挙する:
//   robot×prelude / prelude×robot / robot×robot×prelude
// タグは CHAR_REGISTRY cands に宣言するだけでエンジンにキャラ名リテラルなし。
function enumerateRootPrefixes(){
  const probe=new Sim(); probe.totalTurns=10;
  probe._beginTurn(1); probe._primeLookaheads(1);
  const cands=probe._candidates();
  const prefixes=[[]]; // 空プレフィックス=現行のビーム単体(回帰確認用に必ず含める)
  for(const c of cands) prefixes.push([c.key]);
  const robotKeys=cands.filter(c=>c.deploysRobot).map(c=>c.key);
  const preludeKeys=cands.filter(c=>c.prelude).map(c=>c.key);
  // deploysRobot × deploysRobot (2手順列)
  for(const a of robotKeys) for(const b of robotKeys) if(a!==b) prefixes.push([a,b]);
  // deploysRobot × prelude / prelude × deploysRobot (異種ペア)
  for(const r of robotKeys) for(const p of preludeKeys){ prefixes.push([r,p]); prefixes.push([p,r]); }
  // deploysRobot × deploysRobot × prelude (3手順列: ロボ2台起動→バフ)
  for(const a of robotKeys) for(const b of robotKeys) if(a!==b) for(const p of preludeKeys) prefixes.push([a,b,p]);
  return prefixes;
}

// ルート分散の1ルート実行: 開幕prefixを強制してnターン完遂し {prefix,dmg,rows} を返す。
// Worker側(タスク処理)とメインスレッドのフォールバック双方から呼ぶ唯一の実装(prefix強制の
// 手順をここに集約し二重管理を防ぐ)。rowsはgreedyTakeTurnの戻り値配列=構造化複製可能。
function _runRootPlan(prefix, n){
  const sim=new Sim(); sim.totalTurns=n;
  if(prefix.length){ sim._forcePrefix=prefix; sim._forceTurn=1; }
  const rows=[]; for(let t=1;t<=n;t++) rows.push(sim.greedyTakeTurn(t));
  return {prefix, dmg:sim.dmg, rows};
}

// 基準シム(静的greedyのみ・planDepth=2で強制): 対基準比の分母に使う総ダメージを返す。
function _runBaselinePlan(n){
  const base=new Sim(); base.totalTurns=n; base.planDepth=2;
  for(let t=1;t<=n;t++) base.greedyTakeTurn(t);
  return base.dmg;
}

// ===== Web Worker プール (Blob・ルート分散) =====
// ビームサーチ単体は「今すぐの価値が低いが後続の押し順次第で伸びる」候補(例: 補助ロボ起動の
// 直後に複数の黄アビを連打するシナジー)をBEAM_W幅のカットで早期に切り落としてしまう
// (詳細はCLAUDE.md「ビームのランキング」節)。これを安価に補うため、T1開幕の候補ごとに
// 開幕を強制した独立ビームサーチ(=ルート)を enumerateRootPrefixes() で汎用列挙し、
// navigator.hardwareConcurrency 分のWorkerプールに分散して並列実行、最終ダメージ最大の
// ルートを採用する。各ルートの実コストは従来の単体ビームと同等(~15s)なので、
// P並列なら ceil((K+1)/P)×15s 程度のライブ再計算時間で済む。
// Workerは {type:'init',...} で1回初期化後、{type:'root',...}/{type:'baseline',...} タスクを
// 受け取り次第処理して結果を返す(タスクキューはメインスレッドが管理)。
let _workerPool=null, _workerCodeCache=null;

function _terminateWorkerPool(){
  if(_workerPool){ for(const w of _workerPool) w.terminate(); _workerPool=null; }
}

// 採用ルート確定後の共通仕上げ: SIM_ROWS反映→カード描画→サマリー(renderSim)。
// プール完了(onAllDone)とフォールバックの双方から呼ぶ。
function _finishSim(best, baseDmg){
  document.getElementById('sim-loading').classList.remove('active');
  SIM_ROWS = best ? best.rows : [];
  document.getElementById('sim-results').innerHTML =
    SIM_ROWS.map((r,i)=>cardHTML(r,i===0)).join('');
  renderSim(baseDmg, best ? best.prefix : []);
}

function _buildWorkerCode(){
  // index.html全体から // ===== ゲーム定数 〜 // ===== UI HELPERS 直前までのエンジンコードを抽出。
  // エンジン本文はページ生存中不変なので初回のみ抽出してキャッシュ(innerHTML全文字列化を毎回避ける)。
  // root/baseline実行は _runRootPlan/_runBaselinePlan(エンジン領域=抽出範囲内)に集約しWorker/フォールバックで共用。
  if(_workerCodeCache) return _workerCodeCache;
  const src=document.documentElement.innerHTML;
  const engineCode=src.slice(src.indexOf('// ===== ゲーム定数'), src.indexOf('// ===== UI HELPERS'));
  _workerCodeCache=`
${engineCode}
// ===== Worker エントリポイント =====
self.onmessage=function(e){
  const d=e.data;
  if(d.type==='init'){
    for(const [k,v] of Object.entries(d.gearState)) GEAR[k]=v;
    if(d.gearKC) for(const [k,v] of Object.entries(d.gearKC)) GEAR_K_C[k]=v;
    if(d.dmgBase){ DMG.base_atk=d.dmgBase.base_atk; DMG.affinity=d.dmgBase.affinity;
      // ドロイド反応の倍率/減衰(ランチャータンク装備でメイン側が上書き済の実効値)を反映
      if(d.dmgBase.droid_react_mult!=null) DMG.droid_react_mult=d.dmgBase.droid_react_mult;
      if(d.dmgBase.droid_react_cap!=null)  DMG.droid_react_cap =d.dmgBase.droid_react_cap; }
    recalcGearK();
    buildFormation(d.heroKey,d.kamihimeKeys);
    self.postMessage({type:'ready'});
  } else if(d.type==='root'){
    self.postMessage({type:'rootResult', rootId:d.rootId, ..._runRootPlan(d.prefix,d.n)});
  } else if(d.type==='baseline'){
    self.postMessage({type:'baselineResult', baseDmg:_runBaselinePlan(d.n)});
  }
};
`;
  return _workerCodeCache;
}

function runSim(){
  const heroEl=document.querySelector('input[name="hero-sel"]:checked');
  if(!heroEl){ alert('英霊を選択してください'); return; }
  const kamihimeKeys=[0,1,2,3].map(i=>document.getElementById(`kslot-${i}`)?.value||'');
  if(kamihimeKeys.some(k=>!k)){ alert('神姫を4人選択してください'); return; }

  const n=Math.max(1,Math.min(30,parseInt(document.getElementById('turns-n').value)||10));
  const heroKey=heroEl.value;

  // 編成・装備をメインスレッド側でも反映(renderParty用)。enumerateRootPrefixes()もこのCHAR_REGISTRY状態に依存する。
  applyGear();
  buildFormation(heroKey,kamihimeKeys);
  renderParty();

  // ローディング表示
  const ld=document.getElementById('sim-loading');
  const prog=document.getElementById('spin-progress');
  document.getElementById('summary-bar').style.display='none';
  document.getElementById('sim-results').innerHTML='';
  ld.classList.add('active');
  prog.textContent='準備中';

  SIM_ROWS=[];

  // 既存プールを破棄して新規生成
  _terminateWorkerPool();
  let workerCode;
  try{ workerCode=_buildWorkerCode(); } catch(err){ _fallbackRunSim(heroKey,kamihimeKeys,n); return; }

  const prefixes=enumerateRootPrefixes();
  const poolSize=Math.max(1,Math.min(navigator.hardwareConcurrency||4, prefixes.length+1));

  let blob,url,workers;
  try{
    blob=new Blob([workerCode],{type:'text/javascript'});
    url=URL.createObjectURL(blob);
    workers=Array.from({length:poolSize},()=>new Worker(url));
  } catch(err){ _fallbackRunSim(heroKey,kamihimeKeys,n); return; }
  URL.revokeObjectURL(url); // 全Workerが起動済みなので即revoke可
  _workerPool=workers;

  const initMsg={type:'init',heroKey,kamihimeKeys,gearState:{...GEAR},
    gearKC:{...GEAR_K_C},dmgBase:{base_atk:DMG.base_atk,affinity:DMG.affinity,
      droid_react_mult:DMG.droid_react_mult,droid_react_cap:DMG.droid_react_cap}};
  const tasks=prefixes.map((prefix,rootId)=>({type:'root',rootId,prefix,n}));
  tasks.push({type:'baseline',n});

  let nextTask=0, done=0; const total=tasks.length;
  const rootResults=[]; let baseDmg=0, failed=false;

  function dispatch(w){ if(nextTask<total) w.postMessage(tasks[nextTask++]); }

  function onAllDone(){
    if(failed) return;
    _workerPool=null;
    rootResults.sort((a,b)=>b.dmg-a.dmg);
    _finishSim(rootResults[0], baseDmg);
  }

  for(const w of workers){
    w.onmessage=function(e){
      const d=e.data;
      if(d.type==='ready'){ dispatch(w); return; }
      if(d.type==='rootResult') rootResults.push(d);
      else if(d.type==='baselineResult') baseDmg=d.baseDmg;
      done++;
      prog.textContent=`ルート ${done}/${total} 計算中(${poolSize}並列)…`;
      if(done>=total){ onAllDone(); return; }
      dispatch(w);
    };
    w.onerror=function(){
      if(failed) return; failed=true;
      _terminateWorkerPool();
      _fallbackRunSim(heroKey,kamihimeKeys,n);
    };
    w.postMessage(initMsg);
  }
}

// Workerが使えない環境向けフォールバック(メインスレッド同期実行・ルート分散も逐次で再現)
function _fallbackRunSim(heroKey,kamihimeKeys,n){
  const prog=document.getElementById('spin-progress');
  document.getElementById('sim-loading').classList.add('active');
  setTimeout(()=>{
    buildFormation(heroKey,kamihimeKeys); applyGear();
    const prefixes=enumerateRootPrefixes();
    let best=null;
    prefixes.forEach((prefix,i)=>{
      prog.textContent=`ルート ${i+1}/${prefixes.length} 計算中(非並列フォールバック)…`;
      const r=_runRootPlan(prefix,n);
      if(!best||r.dmg>best.dmg) best=r;
    });
    _finishSim(best, _runBaselinePlan(n));
  },0);
}

function renderSim(baseDmg, winningPrefix=[]){
  const rows=SIM_ROWS; if(!rows.length) return;
  const f=uiFeats();
  // ルート分散で採用された開幕(CD_SHOW表示名で汎用表示・空ならビーム単体=従来通り)
  const rootHtml=winningPrefix.length
    ?`<div class="summary-stat"><span class="val" style="font-size:13px;">${winningPrefix.map(k=>CD_SHOW[k]||k).join('→')}</span><span class="lbl">採用ルート(開幕)</span></div>`:'';
  const fb=rows.filter(r=>r.full).length;
  const ht=rows.find(r=>r.helix);
  const fin=rows[rows.length-1];
  const optDmg=fin.dmg;
  // 火力指数: optimal÷baseline×100。基準(素直押し)=100。baseDmg未提供時はindex非表示。
  const idx=baseDmg>0 ? optDmg/baseDmg*100 : 0;
  const grade=idx>=130?'S':idx>=115?'A':idx>=105?'B':'C';
  const gcls=grade==='S'?'gs':grade==='A'?'ga':grade==='B'?'gb':'gc';
  const barColor=grade==='S'?'#d97706':grade==='A'?'var(--accent2)':grade==='B'?'var(--green)':'var(--muted)';
  // バー: 100=左端, 160=右端(60pt幅)でクランプ
  const barPct=Math.min(100,Math.max(0,(idx-100)/60*100));
  const fiHtml=baseDmg>0?`
    <div class="fi-block">
      <div class="fi-top">
        <span class="fi-val" style="color:${barColor}">${idx.toFixed(1)}</span>
        <span class="fi-grade ${gcls}">${grade}</span>
      </div>
      <div class="fi-bar-wrap"><div class="fi-bar-fill" style="width:${barPct}%;background:${barColor}"></div></div>
      <div class="fi-sub">🔥 火力指数（素直押し=100）</div>
    </div>`:'';
  document.getElementById('summary-bar').style.display='';
  document.getElementById('summary-bar').innerHTML=`
    <div class="summary-bar">
      ${fiHtml}
      <div class="summary-stat"><span class="val" style="color:var(--green)">${fb}/${rows.length}</span><span class="lbl">フルバースト</span></div>
      ${f.renri?`<div class="summary-stat"><span class="val">${ht?`T${ht.t}`:'未達'}</span><span class="lbl">HELIX解禁</span></div>`:''}
      ${f.renri?`<div class="summary-stat"><span class="val">${fin.renri}/30</span><span class="lbl">最終連理魔力</span></div>`:''}
      ${f.keigyo?`<div class="summary-stat"><span class="val">${fin.keigyo}/15</span><span class="lbl">最終契晶</span></div>
      <div class="summary-stat"><span class="val">${fin.cum}</span><span class="lbl">累計契晶</span></div>`:''}
      <div class="summary-stat"><span class="val">${rows.reduce((s,r)=>s+r.burst,0)}</span><span class="lbl">総バースト</span></div>
      <div class="summary-stat"><span class="val">${rows.reduce((s,r)=>s+r.ability,0)}</span><span class="lbl">総アビ</span></div>
      ${rootHtml}
    </div>
    <table class="summary-table">
      <tr><th>T</th><th>FB</th><th>火力推移</th><th>バースト</th><th>アビ</th>${f.robot?'<th>ロボ作動</th>':''}${f.renri?'<th>ジャッジ</th><th>連理累計</th>':''}${f.keigyo?'<th>契晶(現/累)</th>':''}${f.moon?'<th>🌙ムーン</th>':''}</tr>
      ${rows.map(r=>{
        const fb2=r.full?`<span class="tg">✅5人</span>`:`<span class="to">${r.atk.length}人</span>`;
        const dmgDisp=baseDmg>0?(r.dmg/baseDmg*100).toFixed(1):`${Math.round(r.dmg).toLocaleString()}`;
        return `<tr><td><b>T${r.t}</b></td><td>${fb2}</td><td>${dmgDisp}</td><td>${r.burst}</td><td>${r.ability}</td>${f.robot?`<td>${r.ra}</td>`:''}${f.renri?`<td>${r.ju}</td><td>${r.renri}/30</td>`:''}${f.keigyo?`<td>${r.keigyo}/${r.cum}</td>`:''}${f.moon?`<td>${r.mooncode}T</td>`:''}</tr>`;
      }).join('')}
    </table>`;
  // ターンカードは呼び出し元(runSim/_fallbackRunSim)が採用ルート確定後に描画済み。
}

// ドロイド反応の基準値(英霊武器未装備時)。ランチャータンク装備で applyGear が上書きするため保持。
const DROID_REACT_BASE = { mult: DMG.droid_react_mult, cap: DMG.droid_react_cap };

function applyGear(){
  // 属性相性
  DMG.affinity = document.getElementById('dmg-affinity')?.value==='adv'?1.5:1.0;
  for(const [box] of GEAR_BOXES) GEAR[box]=0;
  // ドロイド反応倍率/減衰を基準値にリセット(ランチャータンク検出時に下のループで上書き)
  DMG.droid_react_mult = DROID_REACT_BASE.mult;
  DMG.droid_react_cap  = DROID_REACT_BASE.cap;

  // 幻獣のweapon_amp合計と直接ボックス補正を収集(ダメージ用。表示攻撃力の幻獣寄与は手動合計入力)
  let weaponAmp=0;
  const summonBoxes=[];
  for(let i=0;i<SUMMON_SLOTS;i++){
    const key=document.getElementById('summon-'+i)?.value;
    const s=SUMMON_REGISTRY[key]; if(!s) continue;
    weaponAmp+=s.weapon_amp||0; summonBoxes.push(s.box);
  }

  // ウェポンスキルからGEAR_BOXESを自動計算
  const heroKey=document.querySelector('input[name="hero-sel"]:checked')?.value||LEADER;
  const slots=Array.from({length:10},(_,i)=>document.getElementById('wslot-'+i)?.value||'');
  if(typeof WEAPON_MASTER!=='undefined'){
    for(let i=0;i<slots.length;i++){
      const w=WEAPON_MASTER[slots[i]]; if(!w) continue;
      const isMain=(i===0);
      for(const sk of (w.skills||[])){
        if(sk.condition?.mainOf&&!(isMain&&sk.condition.mainOf===heroKey)) continue;
        if(sk.droidUpgrade){ // ランチャータンク: 攻撃ロボ反応の倍率/減衰を強化(メインエジソン限定)
          DMG.droid_react_mult = sk.droidUpgrade.mult;
          DMG.droid_react_cap  = sk.droidUpgrade.cap;
          continue;
        }
        if(sk.box==='defender') continue; // HP専用・ダメージGEAR外
        if(sk.stinger){
          GEAR.acute += (sk.rate/100)*(1+weaponAmp)*0.20; // 発動率×weapon_amp×固定+20%
        } else if(GEAR[sk.box]!==undefined){
          GEAR[sk.box] += (sk.pct/100)*(1+weaponAmp);
        }
      }
    }
  }

  // 追加補正(手動入力・ウェポンマスタ外の補完用)
  for(const [box] of GEAR_BOXES){
    const v=parseFloat(document.getElementById('wpn-'+box)?.value)||0;
    GEAR[box]+=v/100*(1+weaponAmp);
  }
  // 幻獣直接ボックス補正
  for(const sb of summonBoxes)
    for(const [box,amt] of Object.entries(sb))
      if(GEAR[box]!==undefined) GEAR[box]+=amt;

  recalcGearK();

  // per-character 表示攻撃力/HP & GEAR_K_C
  GEAR_K_C={}; DISPLAY_ATK_C={}; DISPLAY_HP_C={};
  if(typeof WEAPON_MASTER!=='undefined'&&CHARS.length>0&&Object.keys(ELEM).length>0){
    const heroRank=parseInt(document.getElementById('hero-rank')?.value)||165;
    const sumAtkTotal=parseFloat(document.getElementById('summon-atk-total')?.value)||0;
    const sumHpTotal=parseFloat(document.getElementById('summon-hp-total')?.value)||0;
    for(const charKey of CHARS){
      // 実機表示の直接指定があれば最優先(Lv上限解放/+99等を0-fudgeで内包)。無ければ満凸decompose推定。
      const dispAtk=DISPLAY_ATK_OVERRIDE[charKey]||calcDisplayAtk(charKey,slots,sumAtkTotal,heroRank);
      // 実機表示HPの直接指定があれば最優先(ATKと対称)。無ければ満凸decompose推定。
      const dispHp=DISPLAY_HP_OVERRIDE[charKey]||calcDisplayHp(charKey,slots,sumHpTotal,heroRank);
      if(dispAtk>0){
        DISPLAY_ATK_C[charKey]=dispAtk;
        DISPLAY_HP_C[charKey]=dispHp;
        GEAR_K_C[charKey]=dispAtk*(1+GEAR.dmgup)*(1+GEAR.other)*(1+GEAR.technica)*DMG.misc/DMG.enemy_def; // affinityは_na()属性枠/technicaはburst割戻し対象
      }
    }
  }
  // シミュは重い(ビームサーチ・数秒〜10秒)ため自動再実行しない。▶ボタンで明示実行する。
}

// ===== 編成保存スロット(GitHub Gist同期) =====
// 単一ユーザー前提・ブラウザ間共有用。トークンは各ブラウザのlocalStorageに保持し、
// 編成データ本体(スロット配列)はSecret Gist 1個に集約してGET/PATCHで同期する。
const GIST_FILE = 'kamipro_slots.json';
let SLOTS = [];
let SLOTS_LOADED = false;

function ghToken(){ return localStorage.getItem('kp_gh_token')||''; }
function ghGistId(){ return localStorage.getItem('kp_gist_id')||''; }

async function ghRequest(path, opts={}){
  const res = await fetch('https://api.github.com'+path, {
    ...opts,
    headers: { 'Authorization':'token '+ghToken(), 'Accept':'application/vnd.github+json', ...(opts.headers||{}) },
  });
  if(!res.ok) throw new Error('GitHub API '+res.status+': '+(await res.text()).slice(0,200));
  return res.json();
}

async function loadSlotsFromGist(){
  const id = ghGistId();
  if(!id){ SLOTS=[]; SLOTS_LOADED=true; return; }
  const data = await ghRequest('/gists/'+id);
  const content = data.files?.[GIST_FILE]?.content;
  SLOTS = content ? JSON.parse(content) : [];
  SLOTS_LOADED = true;
}

async function persistSlots(){
  const body = { description:'神姫PROJECT R 編成保存スロット', public:false,
    files:{ [GIST_FILE]:{ content: JSON.stringify(SLOTS, null, 1) } } };
  if(ghGistId()){
    await ghRequest('/gists/'+ghGistId(), { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  } else {
    const data = await ghRequest('/gists', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    localStorage.setItem('kp_gist_id', data.id);
  }
}

  const weapons = Array.from({length:10},(_,i)=>document.getElementById('wslot-'+i)?.value||'');
  const wpnBoxes = {};
  for(const [k] of GEAR_BOXES) wpnBoxes[k]=document.getElementById('wpn-'+k)?.value||'0';
  return {
    hero: heroKey, kamihime: kamihimeKeys, summon, weapons, wpnBoxes,
    affinity: document.getElementById('dmg-affinity')?.value||'neu',
    heroRank: document.getElementById('hero-rank')?.value||'165',
    summonAtkTotal: document.getElementById('summon-atk-total')?.value||'0',
    summonHpTotal: document.getElementById('summon-hp-total')?.value||'0',
  };
}

// 保存済みスロットの内容をUIへ反映し、編成・シムを再構築する
function applyFormation(slot){
  document.getElementById('hr-'+slot.hero).checked = true;
  for(let i=0;i<4;i++) document.getElementById(`kslot-${i}`).value = slot.kamihime[i]||'';
  syncSlots();
  renderGearPanel();
  for(let i=0;i<SUMMON_SLOTS;i++){ const el=document.getElementById('summon-'+i); if(el) el.value = slot.summon?.[i]||'none'; }
  for(let i=0;i<10;i++){ const el=document.getElementById('wslot-'+i); if(el) el.value = slot.weapons?.[i]||''; }
  for(const [k] of GEAR_BOXES){ const el=document.getElementById('wpn-'+k); if(el) el.value = slot.wpnBoxes?.[k]||'0'; }
  document.getElementById('dmg-affinity').value = slot.affinity||'neu';
  document.getElementById('hero-rank').value = slot.heroRank||'165';
  document.getElementById('summon-atk-total').value = slot.summonAtkTotal||'0';
  document.getElementById('summon-hp-total').value = slot.summonHpTotal||'0';
  buildFormation(slot.hero, slot.kamihime);
  applyGear();
  renderParty();
  clearSim();
}

function slotSummaryText(slot){
  const heroJp = CHAR_REGISTRY[slot.hero]?.jp||slot.hero;
  const kamJp = slot.kamihime.map(k=>CHAR_REGISTRY[k]?.jp||'?').join('/');
  return `${heroJp} ＋ ${kamJp}`;
}

function renderSlotsPanel(){
  const panel = document.getElementById('slots-panel');
  if(!ghToken()){
    panel.innerHTML = `
      <div class="gear-card">
        <div class="cfg-title">💾 編成保存スロット（GitHub Gist同期）</div>
        <div class="gear-row" style="gap:8px;">
          <input type="password" id="gh-token-input" placeholder="GitHub Personal Access Token (gist権限)" style="flex:1;min-width:240px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;">
          <button class="btn btn-primary btn-sm" onclick="saveTokenAndInit()">連携</button>
        </div>
        <div style="font-size:10px;color:var(--muted);margin-top:6px;">
          このブラウザのlocalStorageにのみ保存されます。トークンはGitHub設定→Developer settings→
          Personal access tokens で「gist」権限のみ付与して発行してください。
        </div>
      </div>`;
    return;
  }
  if(!SLOTS_LOADED){
    panel.innerHTML = `<div class="gear-card"><div class="cfg-title">💾 編成保存スロット</div><div class="slot-status">読込中…</div></div>`;
    return;
  }
  const cards = SLOTS.map(s=>`
    <div class="slot-card">
      <div class="slot-name">${s.name}</div>
      <div class="slot-members">${slotSummaryText(s)}</div>
      <div class="slot-btns">
        <button class="btn btn-secondary btn-sm" onclick="loadSlotById('${s.id}')">呼出</button>
        <button class="btn btn-secondary btn-sm" onclick="overwriteSlotById('${s.id}')">上書き</button>
        <button class="btn btn-secondary btn-sm" onclick="deleteSlotById('${s.id}')">削除</button>
      </div>
    </div>`).join('') || `<div class="slot-empty">保存済みの編成はありません</div>`;
  panel.innerHTML = `
    <div class="gear-card">
      <div class="cfg-title">💾 編成保存スロット（GitHub Gist同期）</div>
      <div class="gear-row" style="gap:8px;">
        <input type="text" id="slot-name-input" placeholder="新しいスロット名（例: 光エジソン基準）" style="flex:1;min-width:200px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;">
        <button class="btn btn-primary btn-sm" onclick="saveNewSlot()">＋ 現在の編成を保存</button>
      </div>
      <div class="slot-grid">${cards}</div>
      <div id="slot-status" class="slot-status"></div>
    </div>`;
}

function slotStatus(msg){ const el=document.getElementById('slot-status'); if(el) el.textContent=msg; }

async function saveTokenAndInit(){
  const v = document.getElementById('gh-token-input')?.value.trim();
  if(!v) return;
  localStorage.setItem('kp_gh_token', v);
  await refreshSlotsPanel();
}

async function refreshSlotsPanel(){
  renderSlotsPanel();
  try{
    await loadSlotsFromGist();
    renderSlotsPanel();
  } catch(err){
    SLOTS_LOADED = true;
    renderSlotsPanel();
    slotStatus('読込エラー: '+err.message);
  }
}

async function saveNewSlot(){
  const name = document.getElementById('slot-name-input')?.value.trim();
  if(!name){ alert('スロット名を入力してください'); return; }
  const slot = { id: String(Date.now()), name, savedAt: new Date().toISOString(), ...captureFormation() };
  SLOTS.push(slot);
  slotStatus('保存中…');
  try{ await persistSlots(); renderSlotsPanel(); }
  catch(err){ SLOTS.pop(); slotStatus('保存エラー: '+err.message); }
}

async function overwriteSlotById(id){
  const idx = SLOTS.findIndex(s=>s.id===id);
  if(idx<0) return;
  if(!confirm(`「${SLOTS[idx].name}」を現在の編成で上書きしますか？`)) return;
  const prev = SLOTS[idx];
  SLOTS[idx] = { ...prev, ...captureFormation(), savedAt: new Date().toISOString() };
  slotStatus('上書き中…');
  try{ await persistSlots(); renderSlotsPanel(); }
  catch(err){ SLOTS[idx]=prev; slotStatus('上書きエラー: '+err.message); }
}

async function deleteSlotById(id){
  const idx = SLOTS.findIndex(s=>s.id===id);
  if(idx<0) return;
  if(!confirm(`「${SLOTS[idx].name}」を削除しますか？`)) return;
  const removed = SLOTS.splice(idx,1)[0];
  slotStatus('削除中…');
  try{ await persistSlots(); renderSlotsPanel(); }
  catch(err){ SLOTS.splice(idx,0,removed); slotStatus('削除エラー: '+err.message); }
}

function loadSlotById(id){
  const slot = SLOTS.find(s=>s.id===id);
  if(!slot) return;
  applyFormation(slot);
}

// ===== INIT =====
function renderParty(){
  const chips=CHARS.map(c=>{
    const role=c===LEADER?'<span class="pc-role">英霊</span>':'';
    const atkVal=DISPLAY_ATK_C[c];
    const atkBadge=atkVal?`<span class="pc-atk">⚔${atkVal.toLocaleString()}</span>`:'';
    const hpVal=DISPLAY_HP_C[c];
    const hpBadge=hpVal?`<span class="pc-hp">❤${hpVal.toLocaleString()}</span>`:'';
    return `<span class="party-chip">${role}${JP[c]}${atkBadge}${hpBadge}</span>`;
  }).join('');
  document.getElementById('party-bar').innerHTML=
    `<span class="pb-label">編成</span>${chips}`;
  renderLegend();
}

// 凡例のキャラ固有項目(ロボ/ムーン/連理/契晶)を編成に合わせて出し分ける
function renderLegend(){
  const f=uiFeats(), b=[];
  if(f.renri) b.push(`<div><span style="color:var(--red)">★</span> HELIX解禁ターン</div>`);
  if(f.robot) b.push(`<div style="margin-top:6px;"><b style="color:var(--accent2)">ロボ</b> 展開残T</div>`);
  if(f.moon)  b.push(`<div><b style="color:var(--accent2)">🌙</b> ムーンコード残T</div>`);
  if(f.renri) b.push(`<div><b style="color:var(--accent2)">⚡</b> 連理魔力/30</div>`);
  if(f.keigyo)b.push(`<div><b style="color:var(--accent2)">💎</b> 契晶現在/累計</div>`);
  document.getElementById('legend-dyn').innerHTML=b.join('');
}

buildFormation('edison',['yamato','hecate','tetra','elaine']);
renderFormationPanel();
renderGearPanel();
renderParty();
clearSim(); // 初期表示はプレースホルダ（▶ボタンで実行）
refreshSlotsPanel();
</script>
</body>
</html>
