<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神姫 光バーストトラッカー</title>
<style>
:root{--bg:#f5f6f8;--card:#ffffff;--card2:#f0f2f5;--border:#e2e5ea;
  --accent:#5b6ef5;--accent2:#3d4fd6;--green:#1aa179;--orange:#e08a00;
  --red:#e0392b;--text:#1f2430;--muted:#6b7280;--yellow:#b7791f;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 2px 6px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,'Hiragino Kaku Gothic ProN',Meiryo,'Roboto',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;line-height:1.5;}
.header{background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow);
  padding:14px 24px;display:flex;align-items:center;gap:12px;}
.header h1{font-size:16px;color:var(--text);font-weight:700;}
.header .sub{font-size:11px;color:var(--muted);}
.layout{display:flex;height:calc(100vh - 52px);}
.sidebar{width:240px;min-width:240px;background:var(--card);border-right:1px solid var(--border);
  overflow-y:auto;padding:16px;}
.main{flex:1;overflow-y:auto;padding:18px;}
.cfg-title{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border:none;
  border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow);}
.btn-primary:hover{background:var(--accent2);box-shadow:var(--shadow-md);}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);background:var(--card2);}
.btn-sm{padding:4px 10px;font-size:11px;}
.party-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;
  padding:10px 14px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);}
.party-bar .pb-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.party-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:14px;
  font-size:12px;font-weight:600;background:var(--card2);color:var(--text);border:1px solid var(--border);}
.party-chip .pc-role{font-size:9px;color:var(--accent2);font-weight:700;}
.controls{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.controls label{font-size:12px;color:var(--muted);}
.controls input[type=number]{width:58px;background:var(--card);border:1px solid var(--border);
  color:var(--text);padding:6px 8px;border-radius:8px;font-size:14px;text-align:center;}
.summary-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;padding:14px 16px;
  background:var(--card);border-radius:12px;box-shadow:var(--shadow);}
.summary-stat{display:flex;flex-direction:column;align-items:center;flex:1;min-width:80px;}
.summary-stat .val{font-size:20px;font-weight:700;color:var(--accent2);}
.summary-stat .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.turn-card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);}
.turn-card.full-burst{border-left:4px solid var(--green);}
.turn-card.partial{border-left:4px solid var(--orange);}
.turn-card.helix-turn{border-left:4px solid var(--red);}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  background:var(--card);cursor:pointer;user-select:none;}
.card-header:hover{background:var(--card2);}
.turn-label{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.turn-num{font-size:16px;font-weight:700;color:var(--accent2);min-width:30px;}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:12px;
  font-size:10px;font-weight:700;}
.bg{background:rgba(26,161,121,.12);color:var(--green);}
.bo{background:rgba(224,138,0,.12);color:var(--orange);}
.br{background:rgba(224,57,43,.12);color:var(--red);}
.bp{background:rgba(91,110,245,.12);color:var(--accent2);}
.bm{background:var(--card2);color:var(--muted);}
.card-body{padding:14px 16px;}
.card-body.collapsed{display:none;}
.action-order{background:var(--card2);border-radius:10px;padding:11px 13px;margin-bottom:11px;
  font-size:12px;line-height:2.4;}
/* アビリティ色チップ（黄/赤/青/緑＝アビ色と一致） */
.abi-chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:14px;
  border:1px solid;font-size:11px;font-weight:600;white-space:nowrap;}
.ord-arrow{color:var(--muted);margin:0 5px;font-size:11px;}
.gauges{display:flex;flex-direction:column;gap:5px;}
.gauge-row{display:flex;align-items:center;gap:8px;}
.gauge-name{width:54px;font-size:11px;color:var(--muted);text-align:right;flex-shrink:0;}
.gauge-wrap{flex:1;height:8px;background:var(--card2);border-radius:5px;overflow:hidden;}
.gauge-fill{height:100%;border-radius:5px;}
.gauge-val{width:32px;font-size:11px;color:var(--text);text-align:right;flex-shrink:0;font-weight:600;}
.ge{background:#5b6ef5;}
.gy{background:#e84393;}
.gh{background:#1aa179;}
.gt{background:#e08a00;}
.gl{background:#42a5f5;}
.renri-wrap{position:relative;height:12px;background:var(--card2);border-radius:6px;overflow:hidden;margin-bottom:4px;}
.renri-fill{height:100%;background:linear-gradient(90deg,#5b6ef5,#8b5cf6);border-radius:6px;}
.renri-mark{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.12);}
.loops{display:flex;gap:8px;margin-bottom:11px;flex-wrap:wrap;}
.loop-badge{display:flex;flex-direction:column;align-items:center;padding:5px 11px;border-radius:8px;font-size:10px;gap:2px;border:1px solid var(--border);}
.loop-badge .ln{color:var(--muted);}
.loop-badge .lv{font-weight:700;font-size:12px;}
.la{background:rgba(26,161,121,.1);}.la .lv{color:var(--green);}
.li{background:rgba(224,57,43,.08);}.li .lv{color:var(--red);}
.lw{background:rgba(224,138,0,.1);}.lw .lv{color:var(--orange);}
.lp{background:rgba(91,110,245,.1);}.lp .lv{color:var(--accent2);}
.summary-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:18px;
  background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
.summary-table th,.summary-table td{border-bottom:1px solid var(--border);padding:7px 8px;text-align:center;}
.summary-table th{background:var(--card2);color:var(--accent2);font-size:10px;font-weight:700;}
.summary-table tr:last-child td{border-bottom:none;}
.summary-table tr:hover td{background:var(--card2);}
.tg{color:var(--green);font-weight:700;}.to{color:var(--orange);font-weight:600;}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>⚡ 神姫PROJECT R — 光属性バーストトラッカー</h1>
    <div class="sub">バースト編成シミュレーター &amp; 最適押し順トラッカー</div>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="cfg-title">📖 凡例</div>
    <div style="font-size:10px;color:var(--muted);line-height:2.1;">
      <div><span style="color:var(--green)">●</span> 5人フルバースト</div>
      <div><span style="color:var(--orange)">●</span> 部分バースト</div>
      <div><span style="color:var(--red)">★</span> HELIX解禁ターン</div>
      <div style="margin-top:6px;"><b style="color:var(--accent2)">ロボ</b> 展開残T</div>
      <div><b style="color:var(--accent2)">🌙</b> ムーンコード残T</div>
      <div><b style="color:var(--accent2)">⚡</b> 連理魔力/30</div>
      <div><b style="color:var(--accent2)">💎</b> 契晶現在/累計</div>
      <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;">
        <span class="abi-chip" style="background:#fff8e1;color:#b7791f;border-color:#f6c344;">黄</span>
        <span class="abi-chip" style="background:#ffebee;color:#c62828;border-color:#ef5350;">赤</span>
        <span class="abi-chip" style="background:#e3f2fd;color:#1565c0;border-color:#42a5f5;">青</span>
        <span class="abi-chip" style="background:#fafafa;color:#616161;border-color:#bdbdbd;">白</span>
        <span class="abi-chip" style="background:#e8f5e9;color:#2e7d32;border-color:#66bb6a;">緑(回復)</span>
      </div>
    </div>
    <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--border);">
      <div class="cfg-title">📌 固定仕様</div>
      <div style="font-size:10px;color:var(--muted);line-height:1.9;">
        · 連理魔力 同T上限: 5<br>
        · ジャッジ 同T上限: 6回<br>
        · 天矢乱舞: T2以降のみ<br>
        · マシーンタクトゥ: +5/作動<br>
        · FB閾値: 100（カスケードあり）<br>
        · 通常チャネル連理魔力=0
      </div>
    </div>
  </div>

  <div class="main">
    <!-- シミュレーション対象パーティ（動的描画） -->
    <div id="party-bar" class="party-bar"></div>
    <div class="controls">
      <label>ターン数:</label>
      <input type="number" id="turns-n" value="10" min="1" max="30">
      <button class="btn btn-primary" onclick="runSim()">▶ シミュレーション実行</button>
      <button class="btn btn-secondary" onclick="clearSim()">✕ クリア</button>
    </div>
    <div id="summary-bar" style="display:none;"></div>
    <div id="sim-results"></div>
  </div>
</div>

<script>
// ===== ゲーム定数（確定仕様） =====
const RENRI_CAP = 5;   // コヴァレント: 同ターン連理魔力上限
const JUDG_MAX  = 6;   // コヴァレント: 同ターンジャッジ上限
const TENYA_FROM= 2;   // 天矢乱舞: 使用可能開始ターン
const FB_THR    = 100; // フルバースト閾値（カスケードあり）
const MACH_BG   = 5;   // マシーンタクトゥ: ロボ作動1回あたりBG増加
const KEIGYO_MAX= 15;  // 契晶最大値
const LA_TURNS  = 3;   // 現神の祈り先読み: この先何ターン枯渇を予測するか
const BG = {inori:100,funki:10,absolute:20,sleur:15,legend:10,
            pactcore:100,cascade:10,yamato_max:200,other_max:100};
const CHARS = ["edison","yamato","hecate","tetra","elaine"];
const LEADER = "edison"; // 英霊（パーティ比較時はこのデータを差し替える）
const JP = {edison:"エジソン",yamato:"ヤマト",hecate:"ヘカテー",tetra:"テトラ",elaine:"エレイン"};
const GCLS = {edison:"ge",yamato:"gy",hecate:"gh",tetra:"gt",elaine:"gl"};
// [owner, color, cd, keigyo_cost]
const ABIL = {
  banoshik:["edison","y",8,0],  droid:   ["edison","y",8,0],
  ifishant:["edison","y",5,0],  amplifa: ["edison","y",7,0],
  inori:   ["yamato","y",14,0], tenya:   ["yamato","r",12,0],
  funki:   ["yamato","y",5,0],
  puvoir:  ["hecate","y",2,0],  effond:  ["hecate","r",3,0],
  sleur:   ["hecate","y",3,0],
  judg:    ["tetra","r",10,0],  absolute:["tetra","y",10,0],
  divinus: ["tetra","b",10,0],
  alone:   ["elaine","r",0,4],  legend:  ["elaine","y",0,0],
  knights: ["elaine","b",0,3],  pactcore:["elaine","w",0,12],
};
// ===== キャラクタ記述子（段階移行中） =====
// 各キャラのゲージ上限・契晶獲得量・バースト時の固有処理を宣言的に集約。
// エンジン側はこの記述子を読むだけにし、`owner==='edison'` 等の名前直書きを排除する。
// 将来キャラを差し替える際は CHARS / ABIL / CHAR_DEF を編集すれば済むのが目標。
// 各キャラの能力は以下のフックに集約される:
//   gmax        : バースト後ゲージ上限
//   keigyoGain  : 自身バースト時の契晶獲得量
//   onBurst     : バースト時の固有処理(atk=自身の攻撃バーストか)
//   drain       : 毎ターン「条件成立で自律発動する」リアクティブ処理
//                 {phase:'yellow'|'red', run(sim,T,ord,ctx,inRed)}
//   inori/tenya/legend/finisher/turnEnd : 押し順シーケンス上の戦略アクション
//   ctxは {bset,rdy,drainJudg,drainFunki,drainHecate,actY} を提供
const CHAR_DEF = {
  edison: {
    gmax: BG.other_max,
    keigyoGain: 3,
    // 自身の攻撃バースト時、ロボ(ドロイド/バノーシク)のCTを1短縮
    onBurst: (sim, atk) => {
      if(atk){ sim.cd.droid=Math.max(0,sim.cd.droid-1); sim.cd.banoshik=Math.max(0,sim.cd.banoshik-1); }
    },
    // 累計契晶80以上で英霊にBG+20（ターン終了時）
    turnEnd: (sim) => { if(sim.cum>=80) sim.addG([LEADER],20); },
  },

  yamato: {
    gmax: BG.yamato_max,
    keigyoGain: 1,
    // 大和の奮起: CDが0なら全消費。集いし願いの黄4回リセットも拾う。
    // 3回毎に現神の祈りCT-1。赤フェイズ中は奮起後にジャッジも消化。
    drain: { phase:'yellow', run:(sim,T,ord,ctx,inRed)=>{
      while(ctx.rdy('funki')){
        sim.ycount++;
        sim.addG(CHARS,BG.funki);
        if(sim.ycount%3===0) sim.cd.inori=Math.max(0,sim.cd.inori-1);
        sim.use('funki',T,ord);
        if(inRed) ctx.drainJudg();
      }
    }},
    // 現神の祈り: 先読み発動。ゲージが十分なら撃たず、今後の枯渇(フルバースト崩れ)を
    //   予測したときだけ発動して天矢乱舞(2T後に解禁)を間に合わせる。
    //   planningクローン内では発動も先読みもしない（無介入時の枯渇を測る基準＆再帰防止）。
    inori: (sim,T,ord,ctx,t) => {
      if(!ctx.rdy('inori') || sim.planning) return;
      // inoriを撃たない前提で先のターンを試走し、フルバーストが崩れるか確認
      let willDeplete=false;
      const look=sim.clone();
      for(let k=1;k<=LA_TURNS;k++){
        if(look.takeTurn(t+k).atk.length<5){ willDeplete=true; break; }
      }
      if(willDeplete) ctx.actY('inori',()=>{ sim.addG([ownerOf('inori')],BG.inori); sim.inori_p=0; });
    },
    // 天矢乱舞: ゲージ枯渇時のみ(T2以降)。発動後ゲージ-40で同ターン連続発動
    tenya: (sim,T,ord,ctx,t) => {
      const me=ownerOf('tenya');
      const shortCount=CHARS.filter(c=>sim.g[c]<FB_THR).length;
      if(!(t>=TENYA_FROM&&ctx.rdy('tenya')&&shortCount>0)) return;
      const tidx=ord.length;
      sim.use('tenya',T,ord);
      sim.burst(me,ctx.bset,T); ctx.drainJudg(); ctx.drainFunki(true);
      if(T.mobius){ T.mobius=0; ctx.drainHecate(true); }
      T.tenya=1;
      while(T.tenya<3&&sim.g[me]>=40){
        sim.g[me]-=40;
        sim.burst(me,ctx.bset,T); ctx.drainJudg(); ctx.drainFunki(true);
        if(T.mobius){ T.mobius=0; ctx.drainHecate(true); }
        T.tenya++;
        ord[tidx]={text:`${LABEL.tenya}×${T.tenya}(-40×${T.tenya-1})`, color:'r'};
      }
    },
  },

  hecate: {
    gmax: BG.other_max,
    keigyoGain: 1,
    // ヘカテーアビ: 黄(puvoir,sleur)優先→赤フェイズ&ムーンコード時にeffond即バースト。
    // モビウスムーンズで多重リセットされた場合は再帰的に再消化。
    drain: { phase:'yellow', run:(sim,T,ord,ctx,inRed)=>{
      if(ctx.rdy('puvoir')) { sim.use('puvoir',T,ord);                            ctx.drainFunki(inRed); if(inRed) ctx.drainJudg(); }
      if(ctx.rdy('sleur'))  { sim.addG(CHARS,BG.sleur); sim.use('sleur',T,ord);   ctx.drainFunki(inRed); if(inRed) ctx.drainJudg(); }
      if(inRed&&ctx.rdy('effond')&&sim.mooncode>0){
        sim.use('effond',T,ord);
        sim.burst(ownerOf('effond'),ctx.bset,T);
        ctx.drainJudg(); ctx.drainFunki(true);
        if(T.mobius>0){ T.mobius=0; ctx.drainHecate(true); }
      }
    }},
  },

  tetra: {
    gmax: BG.other_max,
    keigyoGain: 1,
    // テトラバースト効果: 自身のアビCD全て-1（誘発バースト時はジャッジ自体を除外）
    onBurst: (sim, atk, owner) => {
      const skip = atk ? [] : ['judg'];
      for(const k of Object.keys(sim.cd)){
        if(ABIL[k]?.[0] !== owner) continue; // 自身のアビのみ対象
        if(skip.includes(k)) continue;
        if(sim.cd[k]>0) sim.cd[k]--;
      }
    },
    // ジャッジメント: CD=0なら即使用(フラグ非蓄積・二値制御)。3周期目(ph1)で自身バースト。
    drain: { phase:'red', run:(sim,T,ord,ctx)=>{
      const me=ownerOf('judg');
      while(sim.cd.judg===0&&T.ju<JUDG_MAX){
        const ph=T.ju%3;
        sim.use('judg',T,ord);
        T.ju++;
        if(ph===1) sim.burst(me,ctx.bset,T);
      }
    }},
  },

  elaine: {
    gmax: BG.other_max,
    keigyoGain: 1,
    // レジェンドトラベラー: 累計契晶を参照(消費なし)。回数分BG供給。
    legend: (sim,T,ord,ctx) => {
      let lu=sim.cum>=1?2:1;
      for(const thr of [26,51,71,80]) if(sim.cum>=thr) lu++;
      const lead100=sim.g[LEADER]>=100;
      for(let i=0;i<lu;i++) ctx.actY('legend',()=>sim.addG(lead100?CHARS:[LEADER,ownerOf('legend')],BG.legend));
    },
    // フィニッシャー: PactCore(英霊CT短縮+全BG)優先、不可ならアロンブレイク連打
    finisher: (sim,T,ord,ctx) => {
      const rdown=sim.cd.droid>0||sim.cd.banoshik>0;
      if(sim.keigyo>=12&&rdown&&sim.g[LEADER]>=100){
        sim.cd.droid=Math.max(0,sim.cd.droid-1);
        sim.cd.banoshik=Math.max(0,sim.cd.banoshik-1);
        sim.addG(CHARS,BG.pactcore);
        sim.use('pactcore',T,ord,'(全+100)');
        ctx.drainJudg(); ctx.drainFunki(true);
        if(T.mobius){ T.mobius=0; ctx.drainHecate(true); }
      } else {
        let al=0;
        while(al<2&&sim.keigyo>=4){
          sim.use('alone',T,ord);
          sim.burst(ownerOf('alone'),ctx.bset,T);
          ctx.drainJudg(); ctx.drainFunki(true);
          if(T.mobius){ T.mobius=0; ctx.drainHecate(true); }
          al++;
        }
      }
    },
  },
};

// アビリティ→所有キャラの解決（編成差し替え時はABIL/CHAR_DEFを編集すれば追従）
const ownerOf = k => ABIL[k][0];
// アビリティ表示ラベルをABIL定義順から自動生成: "キャラ名N(ゲージ効果)"
// 括弧内はバーストゲージ上昇に関する記述のみ。編成差し替え時はABIL/JP/LABEL_SUFFIXを編集すれば自動追従
const LABEL_SUFFIX = {
  inori:'(ヤ+100)', funki:'(+10)', sleur:'(+15)', absolute:'(+20)', legend:'(+10)',
};
const LABEL = (() => {
  const cnt = {};
  return Object.fromEntries(Object.entries(ABIL).map(([k,[owner]])=>{
    cnt[owner]=(cnt[owner]||0)+1;
    return [k, `${JP[owner]}${cnt[owner]}${LABEL_SUFFIX[k]||''}`];
  }));
})();
// CDs that need CT display (non-zero CD abilities)
const CD_SHOW = {
  banoshik:"バノーシク",droid:"ドロイド",ifishant:"イフィシャント",
  amplifa:"アンプリファ",inori:"現神の祈り",tenya:"天矢乱舞",
  funki:"大和の奮起",puvoir:"プヴワール",effond:"エフォンド",
  sleur:"スリール",judg:"ジャッジメント",absolute:"アブソ",divinus:"ディウィヌス"
};

// ===== SIM ENGINE =====
class Sim {
  constructor() {
    this.g=Object.fromEntries(CHARS.map(c=>[c,BG.other_max]));
    this.cd=Object.fromEntries(Object.keys(ABIL).map(k=>[k,0]));
    this.keigyo=4; this.cum=4; this.renri=0;
    this.mooncode=2; this.robot=0; this.ycount=0; this.inori_p=null; this.helix_done=false;
    this.mburst=0;
    this.gmax=Object.fromEntries(CHARS.map(c=>[c,CHAR_DEF[c].gmax]));
  }

  tick() {
    for(const k of Object.keys(this.cd)) if(this.cd[k]>0) this.cd[k]--;
    if(this.robot>0) this.robot--;
    if(this.mooncode>0) this.mooncode--;
  }

  addG(targets, amt, excl=null) {
    for(const c of targets){
      if(excl&&excl.has(c)) continue;
      this.g[c]=Math.min(this.g[c]+amt, this.gmax[c]);
    }
  }

  grif(owner) {
    const gain = CHAR_DEF[owner].keigyoGain;
    this.keigyo=Math.min(this.keigyo+gain, KEIGYO_MAX);
    this.cum+=gain;
  }

  procR(T, channel, usejudg=true) {
    const crossed=(
      (channel==='b'&&T.burst>0&&T.burst%2===0)||
      (channel==='a'&&T.ability>0&&T.ability%12===0)
    );
    if(crossed&&T.proc<RENRI_CAP){
      T.proc++; this.renri++;
      // ジャッジメント「即使用可能」フラグは重複しない＝CDを0にリセットするだけ。
      // CDは0/非0の二値なので、複数procが溜まっても再使用は1回分しか確保されない
      // (既にCD0なら無駄proc)。トークン蓄積による連続使用は不可。
      if(usejudg){
        if(this.cd.judg>0) T.judg_reset++; else T.judg_waste++;
        this.cd.judg=0;
      }
    }
    if(channel==='a'&&T.ability>0&&T.ability%12===0) this.mooncode=2;
  }

  burst(owner, bset, T, atk=false) {
    this.addG(CHARS.filter(c=>c!==owner), BG.cascade, atk?bset:null);
    this.grif(owner); T.burst++;
    if(atk) bset.add(owner);
    // 連理魔力(コヴァレント): バースト2回毎に+1＆ジャッジ即使用可。攻撃フェーズのバーストも対象
    this.procR(T,'b');
    // キャラ固有のバースト時処理（CHAR_DEF記述子に集約）
    CHAR_DEF[owner].onBurst?.(this, atk, owner);
    // モビウスムーンズ: party burst 5回毎にヘカテー(=黄ドレイン所有者)のアビCD全リセット
    this.mburst++;
    if(this.mburst%5===0){
      const ho=ownerOf('puvoir');
      for(const k of Object.keys(ABIL)) if(ownerOf(k)===ho) this.cd[k]=0;
      T.mobius=(T.mobius||0)+1;
    }
  }

  use(name, T, ord, note='') {
    const [,color,cd,cost]=ABIL[name];
    this.cd[name]=cd; if(cost) this.keigyo-=cost; T.ability++;
    // ロボ作動カウント（マシーンタクトゥのBG増加に使用）
    if((color==='y'||color==='r')&&this.robot>0) T.ra++;
    if(color==='y'){
      T.yellow++;
      if(T.yellow%4===0&&T.fr<3){ this.cd.funki=0; T.fr++; }
    }
    this.procR(T,'a');
    ord.push({text:LABEL[name]+(note||''), color});
  }



  takeTurn(t) {
    this.tick();
    const T={ability:0,yellow:0,burst:0,proc:0,fr:0,ra:0,tenya:0,
             ju:0,judg_reset:0,judg_waste:0,mobius:0};
    const ord=[], bset=new Set();
    const rdy=n=>this.cd[n]===0;
    // ── ドレイン関数（実体はCHAR_DEFの各キャラ記述子に集約。ここでは所有者から解決して束ねる） ──
    // drainJudg=judg所有者の赤ドレイン / drainFunki=funki所有者の黄ドレイン / drainHecate=puvoir所有者の黄ドレイン
    const drainRunOf=key=>{ const d=CHAR_DEF[ownerOf(key)]; return d&&d.drain?d.drain.run:null; };
    const judgRun=drainRunOf('judg'), funkiRun=drainRunOf('funki'), hecateRun=drainRunOf('puvoir');
    const ctx={ bset, rdy };
    const drainJudg  =()=>{ if(judgRun)   judgRun(this,T,ord,ctx); };
    const drainFunki =(inRed=false)=>{ if(funkiRun)  funkiRun(this,T,ord,ctx,inRed); };
    const drainHecate=(inRed=false)=>{ if(hecateRun) hecateRun(this,T,ord,ctx,inRed); };
    // 黄/青フェイズ用ラッパー: judg保留(全攻撃バフ・デバフを積んでから赤で消費)
    const actY=(name,prep=null,note='')=>{ if(prep) prep(); this.use(name,T,ord,note); drainFunki(false); };
    const actB=(name,prep=null,note='')=>{ if(prep) prep(); this.use(name,T,ord,note); };
    Object.assign(ctx,{drainJudg,drainFunki,drainHecate,actY});

    // ── 押し順メインシーケンス ──

    // 1) ロボ+アンプリファ: 全てのロボット作動の土台。
    //    ドロイド(赤ロボ・与ダメ底上げ)を先に展開し、バノーシク発動時にも効果が乗るようにする。
    //    ドロイド→バノーシク→アンプリファの順で土台を確保してからjudg/funkiドレイン開始。
    if(rdy('droid'))   { this.robot=3; this.use('droid',T,ord); }
    if(rdy('banoshik')){ this.robot=3; this.use('banoshik',T,ord); }
    if(rdy('amplifa'))  this.use('amplifa',T,ord);
    drainFunki(false); // ロボ+アンプリファ展開後に奮起ドレイン開始

    // 2) 黄バフ(攻撃・火力UP系): 全て赤より前に積む
    //    puvoir(光攻撃・ダメ上限UP) → sleur(防壁+BG) → absolute(全攻撃性能UP+BG) → legend(BG)
    drainHecate(false); // puvoir・sleurをここで消化(黄アビ=ロボ作動+攻撃バフ累積)
    drainFunki(false);
    actY('absolute',()=>this.addG(CHARS,BG.absolute));
    // レジェンドトラベラー(エレイン戦略フック): 累計契晶参照のBG供給
    CHAR_DEF[ownerOf('legend')].legend(this,T,ord,ctx);
    drainFunki(false);

    // 現神の祈り(ヤマト戦略フック): CD明け次第発動（バースト性能UP＋天矢乱舞解放）
    CHAR_DEF[ownerOf('inori')].inori(this,T,ord,ctx,t);

    // イフィシャント: 全CD-1(自身除く) → 黄フェイズ最後に置いて最大効果
    if(rdy('ifishant')) actY('ifishant',()=>{
      for(const k of Object.keys(this.cd)) if(k!=='ifishant'&&this.cd[k]>0) this.cd[k]--;
    });
    drainFunki(false);

    // 3) 青デバフ: 攻防DOWN・バースト耐性DOWN → 赤の直前
    if(rdy('divinus')) actB('divinus');
    if(this.keigyo>=ABIL.knights[3]) actB('knights');

    // ── 赤フェイズ開始: ここで初めてjudgを消費 ──
    // 黄/青で溜まったprocを全バフ・デバフ適用後に一括放出→ジャッジが最大火力で入る
    drainJudg();
    drainFunki(true);

    // 4) ヘカテー赤(effond)+天矢乱舞+契晶 → 各バースト後にdrainJudg/drainFunki/モビウス確認
    drainHecate(true); // effond(ムーンコード時即バースト)含む

    // 天矢乱舞(ヤマト戦略フック): ゲージ枯渇時のみ
    CHAR_DEF[ownerOf('tenya')].tenya(this,T,ord,ctx,t);

    // フィニッシャー(エレイン戦略フック): PactCore優先・不可ならアロンブレイク連打
    CHAR_DEF[ownerOf('alone')].finisher(this,T,ord,ctx);

    // 攻撃フェイズ: ゲージ100以上のキャラがフルバースト
    const atk=[];
    for(const c of CHARS){
      if(this.g[c]>=FB_THR){
        this.g[c]-=100; this.burst(c,bset,T,true); atk.push(c);
        // 攻撃バーストで連理が溜まりジャッジが誘発される→赤フェーズ同様にドレイン
        drainJudg(); drainFunki(true);
        if(T.mobius){ T.mobius=0; drainHecate(true); }
      }
    }

    // ターン終了（連理魔力はprocRでリアルタイム加算済み）
    const rt=T.proc;
    this.addG(CHARS,MACH_BG*T.ra);
    CHAR_DEF[LEADER].turnEnd?.(this); // 英霊固有のターン終了処理（累計契晶80でBG+20）
    if(t%4===0){ this.keigyo=Math.min(this.keigyo+5,KEIGYO_MAX); this.cum+=5; }
    if(this.inori_p!==null){ this.inori_p++; if(this.inori_p===2){ this.cd.tenya=0; this.inori_p=null; } }
    const helix=this.renri>=30&&!this.helix_done;
    if(helix) this.helix_done=true;

    return {
      t,ord,atk,full:atk.length===5,
      burst:T.burst,ability:T.ability,ra:T.ra,ju:T.ju,
      judg_reset:T.judg_reset,judg_waste:T.judg_waste,mobius_this:T.mobius,
      rt,renri:this.renri,keigyo:this.keigyo,cum:this.cum,
      mooncode:this.mooncode,ycount:this.ycount,helix,robot:this.robot,
      gauge:{...this.g}, state:this.snap()
    };
  }

  snap(){
    return{g:{...this.g},cd:{...this.cd},keigyo:this.keigyo,cum:this.cum,
      renri:this.renri,mooncode:this.mooncode,robot:this.robot,
      ycount:this.ycount,inori_p:this.inori_p,helix_done:this.helix_done,mburst:this.mburst};
  }

  // 先読み用の複製。planning=trueのクローンは戦略フック側で介入を抑止し再帰を防ぐ。
  clone(){
    const s=new Sim(); const snap=this.snap();
    s.g={...snap.g}; s.cd={...snap.cd};
    s.keigyo=snap.keigyo; s.cum=snap.cum; s.renri=snap.renri;
    s.mooncode=snap.mooncode; s.robot=snap.robot; s.ycount=snap.ycount;
    s.inori_p=snap.inori_p; s.helix_done=snap.helix_done; s.mburst=snap.mburst;
    s.planning=true;
    return s;
  }
}

// ===== UI HELPERS =====

function gaugesHTML(g){
  return `<div class="gauges">${CHARS.map(c=>{
    const max=CHAR_DEF[c].gmax, pct=Math.min(100,(g[c]/max)*100);
    return `<div class="gauge-row">
      <div class="gauge-name">${JP[c]}</div>
      <div class="gauge-wrap"><div class="gauge-fill ${GCLS[c]}" style="width:${pct}%"></div></div>
      <div class="gauge-val">${g[c]}</div>
    </div>`;
  }).join('')}</div>`;
}

function renriHTML(r){
  const pct=Math.min(100,(r/30)*100);
  return `<div class="renri-wrap">
    <div class="renri-fill" style="width:${pct}%"></div>
    <div class="renri-mark" style="left:${(10/30)*100}%"></div>
    <div class="renri-mark" style="left:${(20/30)*100}%"></div>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);">
    <span>0</span><span>10</span><span>20</span>
    <span style="color:${r>=30?'var(--red)':'var(--muted)'}">30★</span>
  </div>`;
}

// アビリティ色パレット（黄=y 赤=r 青=b 緑=g）。背景/文字/枠
const ACOL={
  y:{bg:'#fff8e1',fg:'#b7791f',bd:'#f6c344',name:'黄'},
  r:{bg:'#ffebee',fg:'#c62828',bd:'#ef5350',name:'赤'},
  b:{bg:'#e3f2fd',fg:'#1565c0',bd:'#42a5f5',name:'青'},
  g:{bg:'#e8f5e9',fg:'#2e7d32',bd:'#66bb6a',name:'緑'},
  w:{bg:'#fafafa',fg:'#616161',bd:'#bdbdbd',name:'白'},
};
function ordChipsHTML(ord){
  return ord.map(o=>{
    const c=ACOL[o.color]||ACOL.y;
    return `<span class="abi-chip" style="background:${c.bg};color:${c.fg};border-color:${c.bd};">${o.text}</span>`;
  }).join('<span class="ord-arrow">→</span>');
}

function loopsHTML(r){
  const rc=r.robot>0?'la':'li', mc=r.mooncode>0?'la':'lw';
  const ec=r.renri>=30?'la':(r.renri>=20?'lw':'li');
  return `<div class="loops">
    <div class="loop-badge ${rc}"><span class="ln">ロボ</span><span class="lv">${r.robot}T</span></div>
    <div class="loop-badge ${mc}"><span class="ln">🌙ムーン</span><span class="lv">${r.mooncode}T</span></div>
    <div class="loop-badge ${ec}"><span class="ln">⚡連理</span><span class="lv">${r.renri}/30</span></div>
    <div class="loop-badge lp"><span class="ln">💎契晶</span><span class="lv">${r.keigyo}/15</span></div>
  </div>`;
}

function cdBadgesHTML(cd){
  return Object.entries(CD_SHOW).map(([k,v])=>{
    const n=cd[k]||0, cls=n===0?'bg':(n<=2?'bo':'bm');
    return `<span class="badge ${cls}" title="${v}">${v.slice(0,4)}:${n}</span>`;
  }).join('');
}

// ===== AUTO SIM =====
let SIM_ROWS=[];
const EXPANDED={};

function toggleCard(t){
  EXPANDED[t]=!EXPANDED[t];
  document.getElementById(`cb-${t}`).classList.toggle('collapsed',!EXPANDED[t]);
  document.getElementById(`ci-${t}`).textContent=EXPANDED[t]?'▲':'▼';
}

function cardHTML(r,first=false){
  EXPANDED[r.t]=first;
  const cls=r.helix?'helix-turn':(r.full?'full-burst':'partial');
  const fb=r.full
    ?`<span class="badge bg">✅ 5人FB</span>`
    :`<span class="badge bo">⚠ ${r.atk.length}人 (${r.atk.map(c=>JP[c]).join(',')})</span>`;
  const hx=r.helix?`<span class="badge br">★ HELIX!</span>`:'';
  const ordHtml=ordChipsHTML(r.ord);
  return `<div class="turn-card ${cls}">
    <div class="card-header" onclick="toggleCard(${r.t})">
      <div class="turn-label">
        <span class="turn-num">T${r.t}</span>${fb}${hx}
        <span class="badge bp">バ×${r.burst}</span>
        <span class="badge bp">アビ×${r.ability}</span>
        <span class="badge ${r.ju>0?'br':'bm'}">J×${r.ju}</span>
        <span class="badge bp">連理${r.renri}/30</span>
      </div>
      <div style="display:flex;align-items:center;gap:7px;">
        <span style="color:var(--muted);font-size:11px;" id="ci-${r.t}">${first?'▲':'▼'}</span>
      </div>
    </div>
    <div class="card-body${first?'':' collapsed'}" id="cb-${r.t}">
      <div class="action-order">${ordHtml}</div>
      ${loopsHTML(r)}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:5px;">終了ゲージ</div>
          ${gaugesHTML(r.gauge)}
        </div>
        <div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:5px;">連理魔力 累計${r.renri}/30</div>
          ${renriHTML(r.renri)}
          <div style="margin-top:9px;font-size:10px;color:var(--muted);margin-bottom:5px;">CT残り</div>
          <div style="display:flex;flex-wrap:wrap;gap:3px;">${cdBadgesHTML(r.state.cd)}</div>
        </div>
      </div>
    </div>
  </div>`;
}

function runSim(){
  const n=Math.max(1,Math.min(30,parseInt(document.getElementById('turns-n').value)||10));
  const sim=new Sim();
  SIM_ROWS=[];
  for(let t=1;t<=n;t++) SIM_ROWS.push(sim.takeTurn(t));
  renderSim();
}

function renderSim(){
  const rows=SIM_ROWS; if(!rows.length) return;
  const fb=rows.filter(r=>r.full).length;
  const ht=rows.find(r=>r.helix);
  const fin=rows[rows.length-1];
  document.getElementById('summary-bar').style.display='';
  document.getElementById('summary-bar').innerHTML=`
    <div class="summary-bar">
      <div class="summary-stat"><span class="val" style="color:var(--green)">${fb}/${rows.length}</span><span class="lbl">フルバースト</span></div>
      <div class="summary-stat"><span class="val">${ht?`T${ht.t}`:'未達'}</span><span class="lbl">HELIX解禁</span></div>
      <div class="summary-stat"><span class="val">${fin.renri}/30</span><span class="lbl">最終連理魔力</span></div>
      <div class="summary-stat"><span class="val">${fin.keigyo}/15</span><span class="lbl">最終契晶</span></div>
      <div class="summary-stat"><span class="val">${fin.cum}</span><span class="lbl">累計契晶</span></div>
      <div class="summary-stat"><span class="val">${rows.reduce((s,r)=>s+r.burst,0)}</span><span class="lbl">総バースト</span></div>
      <div class="summary-stat"><span class="val">${rows.reduce((s,r)=>s+r.ability,0)}</span><span class="lbl">総アビ</span></div>
    </div>
    <table class="summary-table">
      <tr><th>T</th><th>FB</th><th>バースト</th><th>アビ</th><th>ロボ作動</th><th>ジャッジ</th><th>連理累計</th><th>契晶(現/累)</th><th>🌙ムーン</th></tr>
      ${rows.map(r=>{
        const fb2=r.full?`<span class="tg">✅5人</span>`:`<span class="to">${r.atk.length}人</span>`;
        return `<tr><td><b>T${r.t}</b></td><td>${fb2}</td><td>${r.burst}</td><td>${r.ability}</td><td>${r.ra}</td><td>${r.ju}</td><td>${r.renri}/30</td><td>${r.keigyo}/${r.cum}</td><td>${r.mooncode}T</td></tr>`;
      }).join('')}
    </table>`;
  document.getElementById('sim-results').innerHTML=rows.map((r,i)=>cardHTML(r,i===0)).join('');
}

function clearSim(){
  SIM_ROWS=[];
  document.getElementById('sim-results').innerHTML='';
  document.getElementById('summary-bar').style.display='none';
}

// ===== INIT =====
function renderParty(){
  const chips=CHARS.map(c=>{
    const role=c===LEADER?'<span class="pc-role">英霊</span>':'';
    return `<span class="party-chip">${role}${JP[c]}</span>`;
  }).join('');
  document.getElementById('party-bar').innerHTML=
    `<span class="pb-label">編成</span>${chips}`;
}

renderParty();
runSim();
</script>
